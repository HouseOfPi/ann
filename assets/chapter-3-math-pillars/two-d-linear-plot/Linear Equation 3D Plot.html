<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Linear Equation 3D Plot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: transparent; overflow: hidden; }
  #root { position: absolute; inset: 0; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.2/babel.min.js"></script>
  <script type="text/babel">
    const Easing = {
      linear: (t) => t,
      easeOutCubic: (t) => (--t) * t * t + 1,
      easeInOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1),
      easeInOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
      easeOutBack: (t) => {
        const c1 = 1.70158, c3 = c1 + 1;
        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
      },
    };
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
    function interpolate(input, output, ease = Easing.linear) {
      return (t) => {
        if (t <= input[0]) return output[0];
        if (t >= input[input.length - 1]) return output[output.length - 1];
        for (let i = 0; i < input.length - 1; i++) {
          if (t >= input[i] && t <= input[i + 1]) {
            const span = input[i + 1] - input[i];
            const local = span === 0 ? 0 : (t - input[i]) / span;
            const easeFn = Array.isArray(ease) ? (ease[i] || Easing.linear) : ease;
            return output[i] + (output[i + 1] - output[i]) * easeFn(local);
          }
        }
        return output[output.length - 1];
      };
    }
    function animate({ from = 0, to = 1, start = 0, end = 1, ease = Easing.easeInOutCubic }) {
      return (t) => {
        if (t <= start) return from;
        if (t >= end) return to;
        return from + (to - from) * ease((t - start) / (end - start));
      };
    }
    const TimelineContext = React.createContext({ time: 0 });
    const CameraContext = React.createContext({ yaw: -0.24, pitch: 0.10 });
    const useTime = () => React.useContext(TimelineContext).time;
    const useCamera = () => React.useContext(CameraContext);
    function Stage({ children, duration = 21 }) {
      const [time, setTime] = React.useState(3);
      const [cameraYaw, setCameraYaw] = React.useState(-0.24);
      const [cameraPitch, setCameraPitch] = React.useState(0.10);
      const [isDragging, setIsDragging] = React.useState(false);
      const [dragStart, setDragStart] = React.useState({ x: 0, y: 0 });
      const [isPaused, setIsPaused] = React.useState(true);
      const lastTsRef = React.useRef(null);
      const isPausedRef = React.useRef(true);
      React.useEffect(() => { isPausedRef.current = isPaused; lastTsRef.current = null; }, [isPaused]);
      React.useEffect(() => {
        const handler = (e) => {
          if (e.data && e.data.type === 'RESTART_ANIMATION') {
            setTime(3);
            lastTsRef.current = null;
            setIsPaused(true);
          }
        };
        window.addEventListener('message', handler);
        return () => window.removeEventListener('message', handler);
      }, []);
      React.useEffect(() => {
        let rafId;
        const step = (ts) => {
          if (isPausedRef.current) { lastTsRef.current = null; rafId = requestAnimationFrame(step); return; }
          if (lastTsRef.current == null) lastTsRef.current = ts;
          const dt = (ts - lastTsRef.current) / 1000;
          lastTsRef.current = ts;
          setTime(t => {
            const next = t + dt;
            if (next >= duration) {
              isPausedRef.current = true;
              setIsPaused(true);
              return duration;
            }
            return next;
          });
          rafId = requestAnimationFrame(step);
        };
        rafId = requestAnimationFrame(step);
        return () => cancelAnimationFrame(rafId);
      }, [duration]);

      const handleMouseDown = (e) => {
        if (e.target.closest('button')) return;
        if (e.button === 0) {
          setIsDragging(true);
          setDragStart({ x: e.clientX, y: e.clientY });
        }
      };

      const handleMouseMove = (e) => {
        if (!isDragging) return;
        const deltaX = e.clientX - dragStart.x;
        const deltaY = e.clientY - dragStart.y;
        setCameraYaw(prev => prev + deltaX * 0.01);
        setCameraPitch(prev => clamp(prev + deltaY * 0.01, 0.1, Math.PI - 0.1));
        setDragStart({ x: e.clientX, y: e.clientY });
      };

      const handleMouseUp = () => setIsDragging(false);

      React.useEffect(() => {
        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseup', handleMouseUp);
        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseup', handleMouseUp);
        };
      }, [isDragging, dragStart]);

      return (
        <div
          style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', background: 'transparent', cursor: isDragging ? 'grabbing' : 'grab', userSelect: 'none' }}
          onMouseDown={handleMouseDown}
        >
          <TimelineContext.Provider value={{ time }}>
            <CameraContext.Provider value={{ yaw: cameraYaw, pitch: cameraPitch }}>
              {children}
            </CameraContext.Provider>
          </TimelineContext.Provider>
          <button
            onMouseDown={(e) => { e.stopPropagation(); }}
            onClick={(e) => {
              e.stopPropagation();
              setIsPaused(p => {
                if (p && time >= duration - 0.01) { setTime(0); lastTsRef.current = null; }
                return !p;
              });
            }}
            style={{
              position: 'absolute', bottom: 16, left: 16, width: 40, height: 40,
              borderRadius: '50%', border: '1px solid rgba(0,0,0,0.15)',
              background: 'rgba(255,255,255,0.7)',
              color: '#1a1a1a', cursor: 'pointer', display: 'flex',
              alignItems: 'center', justifyContent: 'center',
              padding: 0, zIndex: 10, pointerEvents: 'auto',
              boxShadow: '0 2px 8px rgba(0,0,0,0.08)'
            }}
            aria-label={isPaused ? 'Play' : 'Pause'}
          >
            {isPaused ? (
              <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><path d="M2 1.5 L10 6 L2 10.5 Z"/></svg>
            ) : (
              <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><rect x="2" y="1.5" width="3" height="9"/><rect x="7" y="1.5" width="3" height="9"/></svg>
            )}
          </button>
        </div>
      );
    }

    const PROJ = { scale: 160, cx: 460, cy: 440, ox1: 1.5, ox2: 1.5, oy: 1.2 };
    function project3D(p, yaw, pitch) {
      const px1 = p.x1 - PROJ.ox1, px2 = p.x2 - PROJ.ox2, py = p.y - PROJ.oy;
      const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
      const x = px1 * cy - px2 * sy, z = px1 * sy + px2 * cy, yRot = py * cp - z * sp;
      return { sx: PROJ.cx + x * PROJ.scale, sy: PROJ.cy - yRot * PROJ.scale };
    }
    function Axis({ from, to, yaw, pitch, color, label, progress = 1 }) {
      const t = clamp(progress, 0, 1);
      const tip = { x1: from.x1+(to.x1-from.x1)*t, x2: from.x2+(to.x2-from.x2)*t, y: from.y+(to.y-from.y)*t };
      const a = project3D(from, yaw, pitch), b = project3D(tip, yaw, pitch);
      const ang = Math.atan2(b.sy-a.sy, b.sx-a.sx);
      return (
        <g opacity={t>0.01?1:0}>
          <line x1={a.sx} y1={a.sy} x2={b.sx} y2={b.sy} stroke={color} strokeWidth={1.8} strokeLinecap="round" />
          {t>0.95 && (<>
            <polygon points={`${b.sx},${b.sy} ${b.sx-12*Math.cos(ang)+5*Math.sin(ang)},${b.sy-12*Math.sin(ang)-5*Math.cos(ang)} ${b.sx-12*Math.cos(ang)-5*Math.sin(ang)},${b.sy-12*Math.sin(ang)+5*Math.cos(ang)}`} fill={color} />
            <text x={b.sx+24*Math.cos(ang)} y={b.sy+24*Math.sin(ang)} textAnchor="middle" dominantBaseline="middle" fontFamily="JetBrains Mono, monospace" fontSize={22} fontStyle="italic" fontWeight={600} fill={color}>{label}</text>
          </>)}
        </g>
      );
    }
    function Plane({ w1, w2, b, yaw, pitch, opacity=1, color, range=2.2 }) {
      const corners = [{x1:0,x2:0},{x1:range,x2:0},{x1:range,x2:range},{x1:0,x2:range}].map(c => project3D({...c, y: w1*c.x1+w2*c.x2+b}, yaw, pitch));
      return <polygon points={corners.map(c=>`${c.sx},${c.sy}`).join(' ')} fill={color} fillOpacity={0.2} stroke={color} strokeWidth={2.5} strokeLinejoin="round" opacity={opacity} />;
    }
    const ACCENT='oklch(64% 0.15 30)', RED='oklch(64% 0.15 30)', GREEN='oklch(50% 0.10 220)', AXIS_GRAY='#3a3a3a', INK='#1a1a1a', INK_DIM='#6b6458', MONO='JetBrains Mono, monospace';
    // Timeline (data-points phase removed; downstream beats shifted earlier).
    const T = {EQ_IN:0.4, AXES_IN:1, AXES_BUILT:3, BIAS_IN:3.5, BIAS_BUILT:5.5, W1_IN:6.5, W1_BUILT:8.5, W2_IN:9.5, W2_BUILT:11.5, ORBIT_END:16.5};
    const DURATION=17.5, FINAL_W1=0.45, FINAL_W2=0.35, FINAL_B=0.4;

    function EquationOverlay() {
      const t = useTime();
      const sY=t>T.EQ_IN, sW1=t>T.EQ_IN+0.4, sW2=t>T.EQ_IN+0.9, sB=t>T.EQ_IN+1.4;
      const hB=t>=T.BIAS_IN-0.3&&t<T.W1_IN, hW1=t>=T.W1_IN-0.3&&t<T.W2_IN, hW2=t>=T.W2_IN-0.3&&t<T.W2_BUILT;
      const any=hB||hW1||hW2, bc=any?'rgba(26,26,26,0.15)':INK;
      const bA = animate({from:0,to:FINAL_B,start:T.BIAS_IN,end:T.BIAS_BUILT})(t);
      const w1A = animate({from:0,to:FINAL_W1,start:T.W1_IN,end:T.W1_BUILT})(t);
      const w2A = animate({from:0,to:FINAL_W2,start:T.W2_IN,end:T.W2_BUILT})(t);
      const w1Label = t>=T.W1_IN ? `${w1A.toFixed(2)}x₁` : 'w₁x₁';
      const w2Label = t>=T.W2_IN ? `${w2A.toFixed(2)}x₂` : 'w₂x₂';
      const bLabel  = t>=T.BIAS_IN ? bA.toFixed(2) : 'b';

      const caps = [
        {s:T.AXES_IN,  e:T.BIAS_IN,   t:'A 3D space: two inputs and one output.'},
        {s:T.BIAS_IN,  e:T.W1_IN,     t:'Bias b lifts the plane — a constant offset.'},
        {s:T.W1_IN,    e:T.W2_IN,     t:'w₁ tilts along x₁ — dependence on first input.'},
        {s:T.W2_IN,    e:T.W2_BUILT,  t:'w₂ tilts along x₂ — dependence on second input.'},
      ];
      const caption = caps.find(c => t>=c.s && t<c.e);

      return (
        <div style={{
          position:'absolute', top:0, left:0, right:0,
          display:'flex', flexDirection:'column', alignItems:'center',
          padding:'6px 24px 0',
          pointerEvents:'none',
          gap:5,
        }}>
          <div style={{
            display:'flex', alignItems:'baseline', gap:5,
            fontFamily:MONO, fontSize:16, color:INK, letterSpacing:'0.03em',
          }}>
            <span style={{opacity:sY?1:0, transition:'opacity 0.3s', color:any?'rgba(26,26,26,0.15)':INK}}>y =</span>
            <span style={{opacity:sW1?1:0, transition:'opacity 0.3s', color:hW1?RED:bc, fontWeight:hW1?700:500}}>{w1Label}</span>
            <span style={{opacity:sW2?1:0, transition:'opacity 0.3s', color:bc}}>+</span>
            <span style={{opacity:sW2?1:0, transition:'opacity 0.3s', color:hW2?GREEN:bc, fontWeight:hW2?700:500}}>{w2Label}</span>
            <span style={{opacity:sB?1:0,  transition:'opacity 0.3s', color:bc}}>+</span>
            <span style={{opacity:sB?1:0,  transition:'opacity 0.3s', color:hB?RED:bc, fontWeight:hB?700:500}}>{bLabel}</span>
          </div>
          <div style={{
            minHeight:18,
            fontFamily:'Cormorant Garamond, serif',
            fontSize:14,
            color:INK,
            fontStyle:'italic',
            fontWeight:500,
            letterSpacing:'0.01em',
            opacity: caption ? 0.55 : 0,
            transition:'opacity 0.4s',
            textAlign:'center',
          }}>
            {caption ? caption.t : ' '}
          </div>
        </div>
      );
    }

    function Caption() { return null; }




    function CameraDisplay() { return null; }

    function Scene3D() {
      const t = useTime();
      const { yaw, pitch } = useCamera();
      const axP = animate({start:T.AXES_IN,end:T.AXES_BUILT})(t);
      const bA = animate({from:0,to:FINAL_B,start:T.BIAS_IN,end:T.BIAS_BUILT})(t);
      const w1A = animate({from:0,to:FINAL_W1,start:T.W1_IN,end:T.W1_BUILT})(t);
      const w2A = animate({from:0,to:FINAL_W2,start:T.W2_IN,end:T.W2_BUILT})(t);
      const pO = animate({from:0,to:1,start:T.AXES_BUILT,end:T.BIAS_IN+0.5})(t);
      return (
        <div style={{position:'absolute',top:0,left:0,right:0,bottom:0}}>
          <svg width="100%" height="100%" viewBox="100 100 780 680" preserveAspectRatio="xMidYMid meet">
            <Axis from={{x1:0,x2:0,y:0}} to={{x1:2.7,x2:0,y:0}} yaw={yaw} pitch={pitch} color={AXIS_GRAY} label="x&#8321;" progress={axP} />
            <Axis from={{x1:0,x2:0,y:0}} to={{x1:0,x2:2.7,y:0}} yaw={yaw} pitch={pitch} color={AXIS_GRAY} label="x&#8322;" progress={axP} />
            <Axis from={{x1:0,x2:0,y:0}} to={{x1:0,x2:0,y:2.7}} yaw={yaw} pitch={pitch} color={AXIS_GRAY} label="y" progress={axP} />
            {pO>0.01 && <Plane w1={w1A} w2={w2A} b={bA} yaw={yaw} pitch={pitch} opacity={pO} color={ACCENT} />}
          </svg>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <Stage duration={DURATION}>
        <Caption />
        <EquationOverlay />
        <Scene3D />
        <CameraDisplay />
      </Stage>
    );
  </script>
</body>
</html>

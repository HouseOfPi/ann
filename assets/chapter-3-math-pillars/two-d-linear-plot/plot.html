<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2D Linear Plot – 3D Animated</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: transparent; /* let parent page control background */
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
  <script>
    // ----- Scene setup -----
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(4, 4, 6);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // ----- Axes -----
    const axesHelper = new THREE.AxesHelper(5);
    scene.add(axesHelper);

    // ----- Plane geometry (y = w1*x1 + w2*x2 + b) -----
    const planeGeometry = new THREE.PlaneGeometry(4, 4, 20, 20);
    const material = new THREE.MeshStandardMaterial({
      color: 0x4ee0a0, // using c2 color approximated
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.8,
    });
    const plane = new THREE.Mesh(planeGeometry, material);
    // rotate to align with X and Z axes (x1 → X, x2 → Z, y → Y)
    plane.rotation.x = -Math.PI / 2;
    scene.add(plane);

    // ----- Light -----
    const ambient = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 5, 5);
    scene.add(dirLight);

    // ----- Animation -----
    function animate() {
      requestAnimationFrame(animate);
      // slowly rotate the whole scene for a dynamic view
      scene.rotation.y += 0.0015;
      renderer.render(scene, camera);
    }
    animate();

    // ----- Responsive -----
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    });
  </script>
</body>
</html>

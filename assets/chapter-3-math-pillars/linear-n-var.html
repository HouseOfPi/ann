<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>n Variables Linear Equation | Presentation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=STIX+Two+Math&display=swap" rel="stylesheet" />
  <style>
    :root {
      --c1: #5fe8ec;
      --c2: #4ee0a0;
      --c3: #a78bfa;
      --bg: #000000;
      --fg: #eef2f8;
      --accent: #c97a4a; /* warm amber/terracotta — single professional accent */
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      padding: 32px 50px 40px;
      transition: background 0.5s, color 0.5s;
    }

    .body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 56px;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
    }

    /* ── The equation — hero element ──
       Uses STIX Two Math (a true mathematical typeface) in italic
       for variable letters, giving real math clarity. */
    .equation {
      font-family: 'STIX Two Math', 'Cormorant Garamond', 'Times New Roman', serif;
      font-style: italic;
      font-size: clamp(34px, 5vw, 64px);
      letter-spacing: 0;
      line-height: 1.3;
      color: var(--fg);
      text-align: center;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: baseline;
      gap: 4px 14px;
      font-weight: 500;
    }
    .equation sub {
      font-style: italic;
      font-size: 0.42em;
      padding: 0 1px;
      color: color-mix(in srgb, var(--fg) 65%, transparent);
      font-weight: 500;
      vertical-align: baseline;
      position: relative;
      bottom: -0.25em;
      margin-left: 1px;
    }
    .equation .eq-op,
    .equation .eq-eq {
      font-style: normal;
      color: color-mix(in srgb, var(--fg) 50%, transparent);
      font-weight: 400;
      font-family: 'STIX Two Math', 'Cormorant Garamond', serif;
    }
    .equation .eq-term {
      display: inline-flex;
      align-items: baseline;
      color: var(--accent, #c97a4a);
    }
    .equation .eq-dots {
      font-style: normal;
      color: color-mix(in srgb, var(--fg) 50%, transparent);
      padding: 0 6px;
      letter-spacing: 0.2em;
      font-weight: 400;
    }

    /* ── Legend strip ── */
    .legend {
      display: flex;
      gap: clamp(28px, 4vw, 56px);
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
    }
    .legend-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      max-width: 220px;
      text-align: center;
    }
    .legend-glyph {
      font-family: 'STIX Two Math', 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(26px, 2.8vw, 36px);
      font-weight: 500;
      line-height: 1;
      color: var(--fg);
    }
    .legend-glyph .lg-sub {
      font-style: italic;
      font-size: 0.45em;
      font-weight: 500;
      color: color-mix(in srgb, currentColor 70%, transparent);
      vertical-align: baseline;
      position: relative;
      bottom: -0.25em;
      padding-left: 1px;
    }
    .legend-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: color-mix(in srgb, var(--fg) 70%, transparent);
    }
    .legend-desc {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      color: color-mix(in srgb, var(--fg) 80%, transparent);
    }

    /* ── Tagline ── */
    .tagline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(18px, 1.9vw, 24px);
      line-height: 1.5;
      color: color-mix(in srgb, var(--fg) 80%, transparent);
      text-align: center;
      max-width: 56ch;
    }
    .tagline em { font-style: italic; font-weight: 600; color: color-mix(in srgb, var(--fg) 95%, transparent); }
  </style>
  <link rel="stylesheet" href="../shared/page-title.css">
  <script defer src="../shared/page-title.js"></script>
</head>
<body>
  <page-title id="header" eyebrow="Linear Algebra" title="<em>n</em> Variables"></page-title>

  <div class="body">
    <div class="equation" aria-label="n-variable linear equation">
      <span>y</span>
      <span class="eq-eq">=</span>
      <span class="eq-term">w<sub>1</sub>x<sub>1</sub></span>
      <span class="eq-op">+</span>
      <span class="eq-term">w<sub>2</sub>x<sub>2</sub></span>
      <span class="eq-op">+</span>
      <span class="eq-dots">⋯</span>
      <span class="eq-op">+</span>
      <span class="eq-term">w<sub>n</sub>x<sub>n</sub></span>
      <span class="eq-op">+</span>
      <span>b</span>
    </div>

    <div class="legend">
      <div class="legend-item">
        <span class="legend-glyph">y</span>
        <span class="legend-label">output</span>
        <span class="legend-desc">what we want to predict</span>
      </div>
      <div class="legend-item">
        <span class="legend-glyph" style="color:var(--accent)">x<sub class="lg-sub">i</sub></span>
        <span class="legend-label">inputs</span>
        <span class="legend-desc">the <em style="font-style:italic">n</em> feature values</span>
      </div>
      <div class="legend-item">
        <span class="legend-glyph" style="color:var(--accent)">w<sub class="lg-sub">i</sub></span>
        <span class="legend-label">weights</span>
        <span class="legend-desc">how much each input matters</span>
      </div>
      <div class="legend-item">
        <span class="legend-glyph">b</span>
        <span class="legend-label">bias</span>
        <span class="legend-desc">a constant offset</span>
      </div>
    </div>

    <p class="tagline">
      <em>n</em> inputs, each with its own weight, summed into a single output.
    </p>
  </div>

  <script>
    const PALETTE_MAP = {
      'Warm Linen':  { bg:'#f4f1ea', fg:'#1a1815', light:true,  c1:'#0e7490', c2:'#15803d', c3:'#7c3aed', eyebrow:'#c25d42', accent:'#c25d42' },
      'Green Linen': { bg:'#f4f1ea', fg:'#1a1815', light:true,  c1:'#15803d', c2:'#15803d', c3:'#6d28d9', eyebrow:'#2e8b57', accent:'#2e8b57' },
      'Paper White': { bg:'#ffffff', fg:'#111111', light:true,  c1:'#0e7490', c2:'#15803d', c3:'#6d28d9', eyebrow:'#d0465a', accent:'#d0465a' },
      'Midnight':    { bg:'#000000', fg:'#f0ece4', light:false, c1:'#5fe8ec', c2:'#4ee0a0', c3:'#a78bfa', eyebrow:'#f59e0b', accent:'#f59e0b' },
      'Navy Lime':   { bg:'#0a1428', fg:'#f1f5fb', light:false, c1:'#5fb8e6', c2:'#a3e635', c3:'#a78bfa', eyebrow:'#a3e635', accent:'#a3e635' },
      'Mint':        { bg:'#f0f7f4', fg:'#0f2820', light:true,  c1:'#0e7490', c2:'#166534', c3:'#6d28d9', eyebrow:'#0e9488', accent:'#0e9488' },
      'Plum':        { bg:'#f5f0f7', fg:'#200f28', light:true,  c1:'#0e7490', c2:'#15803d', c3:'#7c3aed', eyebrow:'#7c3aed', accent:'#7c3aed' },
      'Deep Navy':   { bg:'#0a1428', fg:'#eef2f8', light:false, c1:'#5fe8ec', c2:'#4ee0a0', c3:'#a78bfa', eyebrow:'#5fe8ec', accent:'#5fe8ec' },
    };

    function applyPalette(p) {
      document.body.style.setProperty('--bg', p.bg);
      document.body.style.setProperty('--fg', p.fg);
      document.body.classList.toggle('light', p.light);
      document.body.style.setProperty('--c1', p.c1);
      document.documentElement.style.setProperty('--eyebrow-accent', p.eyebrow || p.c1);
      document.body.style.setProperty('--c2', p.c2);
      document.body.style.setProperty('--c3', p.c3);
      document.body.style.setProperty('--accent', p.accent || p.eyebrow || p.c1);
    }

    window.addEventListener('message', (e) => {
      if (!e.data) return;
      if (e.data.type === 'SET_THEME') {
        const p = PALETTE_MAP[e.data.palette] || (e.data.mode === 'light' ? PALETTE_MAP['Warm Linen'] : PALETTE_MAP['Deep Navy']);
        applyPalette(p);
      }
    });
  </script>
</body>
</html>

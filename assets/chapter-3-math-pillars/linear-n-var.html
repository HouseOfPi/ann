<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>n Variables Linear Equation | Presentation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --c1: #5fe8ec;  /* x — inputs */
      --c2: #4ee0a0;  /* w — weights */
      --c3: #a78bfa;  /* b — bias */
      --bg: #000000;
      --fg: #eef2f8;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      padding: 32px 50px 40px;
      transition: background 0.5s, color 0.5s;
    }

    .body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 56px;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
    }

    /* ── The equation — hero element ── */
    .equation {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(28px, 4.4vw, 56px);
      letter-spacing: 0.01em;
      line-height: 1.3;
      color: var(--fg);
      text-align: center;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: baseline;
      gap: 6px 10px;
    }
    .equation sub {
      font-size: 0.6em;
      padding: 0 1px;
      color: color-mix(in srgb, var(--fg) 75%, transparent);
      font-weight: 600;
    }
    .equation .eq-y,
    .equation .eq-eq,
    .equation .eq-op {
      color: color-mix(in srgb, var(--fg) 70%, transparent);
      font-weight: 500;
    }
    .equation .eq-term {
      display: inline-flex;
      align-items: baseline;
    }
    .equation .eq-w { color: var(--c2); font-weight: 700; }
    .equation .eq-x { color: var(--c1); font-weight: 700; padding-left: 2px; }
    .equation .eq-b { color: var(--c3); font-weight: 700; }
    .equation .eq-dots {
      color: color-mix(in srgb, var(--fg) 55%, transparent);
      padding: 0 4px;
      letter-spacing: 0.2em;
    }

    /* ── Legend strip ── */
    .legend {
      display: flex;
      gap: clamp(28px, 4vw, 56px);
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
    }
    .legend-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      max-width: 220px;
      text-align: center;
    }
    .legend-glyph {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(22px, 2.4vw, 30px);
      font-weight: 700;
      line-height: 1;
    }
    .legend-glyph.lg-y { color: color-mix(in srgb, var(--fg) 85%, transparent); }
    .legend-glyph.lg-w { color: var(--c2); }
    .legend-glyph.lg-x { color: var(--c1); }
    .legend-glyph.lg-b { color: var(--c3); }
    .legend-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: color-mix(in srgb, var(--fg) 65%, transparent);
    }
    .legend-desc {
      font-size: 13.5px;
      line-height: 1.45;
      color: color-mix(in srgb, var(--fg) 75%, transparent);
    }

    /* ── Tagline ── */
    .tagline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(18px, 1.9vw, 24px);
      line-height: 1.5;
      color: color-mix(in srgb, var(--fg) 80%, transparent);
      text-align: center;
      max-width: 56ch;
    }
    .tagline em { font-style: italic; color: var(--c2); font-weight: 600; }
  </style>
  <link rel="stylesheet" href="../shared/page-title.css">
  <script defer src="../shared/page-title.js"></script>
</head>
<body>
  <page-title id="header" eyebrow="Linear Algebra" title="<em>n</em> Variables"></page-title>

  <div class="body">
    <div class="equation" aria-label="n-variable linear equation">
      <span class="eq-y">y</span>
      <span class="eq-eq">=</span>
      <span class="eq-term"><span class="eq-w">w</span><sub>1</sub><span class="eq-x">x</span><sub>1</sub></span>
      <span class="eq-op">+</span>
      <span class="eq-term"><span class="eq-w">w</span><sub>2</sub><span class="eq-x">x</span><sub>2</sub></span>
      <span class="eq-op">+</span>
      <span class="eq-dots">⋯</span>
      <span class="eq-op">+</span>
      <span class="eq-term"><span class="eq-w">w</span><sub>n</sub><span class="eq-x">x</span><sub>n</sub></span>
      <span class="eq-op">+</span>
      <span class="eq-b">b</span>
    </div>

    <div class="legend">
      <div class="legend-item">
        <span class="legend-glyph lg-y">y</span>
        <span class="legend-label">output</span>
        <span class="legend-desc">what we want to predict</span>
      </div>
      <div class="legend-item">
        <span class="legend-glyph lg-x">x<sub style="font-size:0.55em">i</sub></span>
        <span class="legend-label">inputs</span>
        <span class="legend-desc">the <em style="font-style:normal;color:var(--c1);font-weight:700">n</em> feature values</span>
      </div>
      <div class="legend-item">
        <span class="legend-glyph lg-w">w<sub style="font-size:0.55em">i</sub></span>
        <span class="legend-label">weights</span>
        <span class="legend-desc">how much each input matters</span>
      </div>
      <div class="legend-item">
        <span class="legend-glyph lg-b">b</span>
        <span class="legend-label">bias</span>
        <span class="legend-desc">a constant offset</span>
      </div>
    </div>

    <p class="tagline">
      <em>n</em> inputs, each with its own weight, summed into a single output.
    </p>
  </div>

  <script>
    const PALETTE_MAP = {
      'Warm Linen':  { bg:'#f4f1ea', fg:'#1a1815', light:true,  c1:'#0e7490', c2:'#15803d', c3:'#7c3aed', eyebrow:'#c25d42' },
      'Green Linen': { bg:'#f4f1ea', fg:'#1a1815', light:true,  c1:'#15803d', c2:'#15803d', c3:'#6d28d9', eyebrow:'#2e8b57' },
      'Paper White': { bg:'#ffffff', fg:'#111111', light:true,  c1:'#0e7490', c2:'#15803d', c3:'#6d28d9', eyebrow:'#d0465a' },
      'Midnight':    { bg:'#000000', fg:'#f0ece4', light:false, c1:'#5fe8ec', c2:'#4ee0a0', c3:'#a78bfa', eyebrow:'#f59e0b' },
      'Navy Lime':   { bg:'#0a1428', fg:'#f1f5fb', light:false, c1:'#5fb8e6', c2:'#a3e635', c3:'#a78bfa', eyebrow:'#a3e635' },
      'Mint':        { bg:'#f0f7f4', fg:'#0f2820', light:true,  c1:'#0e7490', c2:'#166534', c3:'#6d28d9', eyebrow:'#0e9488' },
      'Plum':        { bg:'#f5f0f7', fg:'#200f28', light:true,  c1:'#0e7490', c2:'#15803d', c3:'#7c3aed', eyebrow:'#7c3aed' },
      'Deep Navy':   { bg:'#0a1428', fg:'#eef2f8', light:false, c1:'#5fe8ec', c2:'#4ee0a0', c3:'#a78bfa', eyebrow:'#5fe8ec' },
    };

    function applyPalette(p) {
      document.body.style.setProperty('--bg', p.bg);
      document.body.style.setProperty('--fg', p.fg);
      document.body.classList.toggle('light', p.light);
      document.body.style.setProperty('--c1', p.c1);
      document.documentElement.style.setProperty('--eyebrow-accent', p.eyebrow || p.c1);
      document.body.style.setProperty('--c2', p.c2);
      document.body.style.setProperty('--c3', p.c3);
    }

    window.addEventListener('message', (e) => {
      if (!e.data) return;
      if (e.data.type === 'SET_THEME') {
        const p = PALETTE_MAP[e.data.palette] || (e.data.mode === 'light' ? PALETTE_MAP['Warm Linen'] : PALETTE_MAP['Deep Navy']);
        applyPalette(p);
      }
    });
  </script>
</body>
</html>

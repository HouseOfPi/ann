<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Multiple Linear Regression</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=STIX+Two+Math&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a1428;
    --fg: #f1f5fb;
    --accent: #a3e635;
    --accent-2: #5fb8e6;
    --rule: rgba(241, 245, 251, 0.14);
    --muted: rgba(241, 245, 251, 0.55);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    transition: background 0.4s ease, color 0.4s ease;
  }

  /* ── Animated Canvas Background ── */
  #bgCanvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  /* ── Centered Glow ── */
  .center-glow {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 600px;
    height: 600px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, var(--accent), transparent 70%);
    opacity: 0.04;
    filter: blur(80px);
    z-index: 0;
    animation: glowPulse 5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes glowPulse {
    0%, 100% { opacity: 0.035; transform: translate(-50%, -50%) scale(1); }
    50%      { opacity: 0.065; transform: translate(-50%, -50%) scale(1.15); }
  }

  .stage {
    position: relative;
    z-index: 1;
    height: 100%;
    width: 100%;
    padding: 6vh 7vw;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* ── Center Content ── */
  .center {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    flex: 1;
    gap: 0;
    position: relative;
  }

  /* Decorative accent rule */
  .accent-rule {
    width: 60px;
    height: 3px;
    background: var(--accent);
    border-radius: 2px;
    margin-bottom: 32px;
    opacity: 0;
    transform: scaleX(0);
    animation: ruleGrow 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
  }
  @keyframes ruleGrow {
    to { opacity: 1; transform: scaleX(1); }
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 20px;
    opacity: 0;
    transform: translateY(14px);
    animation: rise 1s ease-out 0.5s forwards;
  }

  .title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: clamp(56px, 8.5vw, 140px);
    line-height: 0.96;
    letter-spacing: -0.025em;
    color: var(--fg);
    margin-bottom: 8px;
    opacity: 0;
    transform: translateY(30px);
    animation: rise 1.3s cubic-bezier(.2,.7,.2,1) 0.7s forwards;
  }

  .title em {
    font-style: italic;
    font-weight: 400;
    color: var(--accent);
  }

  .subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: clamp(22px, 3vw, 38px);
    letter-spacing: 0.04em;
    color: color-mix(in srgb, var(--fg) 50%, transparent);
    font-style: italic;
    opacity: 0;
    transform: translateY(16px);
    animation: rise 1s ease-out 1.1s forwards;
  }

    /* ── Bottom Decorative Equation ── */
  .bottom-eq {
    position: absolute;
    bottom: 5vh;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'STIX Two Math', 'Cormorant Garamond', serif;
    font-size: clamp(16px, 1.8vw, 24px);
    color: color-mix(in srgb, var(--fg) 20%, transparent);
    letter-spacing: 0.06em;
    white-space: nowrap;
    opacity: 0;
    animation: fadeUp 1.2s ease-out 1.6s forwards;
    z-index: 1;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .bottom-eq:hover {
    color: color-mix(in srgb, var(--fg) 40%, transparent);
  }
  .bottom-eq.highlighted {
    transform: translateX(-50%) scale(1.15);
    color: var(--accent);
    text-shadow: 0 4px 24px color-mix(in srgb, var(--accent) 40%, transparent);
  }
  .bottom-eq span {
    color: color-mix(in srgb, var(--accent) 40%, transparent);
    transition: color 0.4s ease;
  }
  .bottom-eq.highlighted span {
    color: var(--fg);
    font-weight: 600;
  }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    to { opacity: 1; }
  }
</style>
<link rel="stylesheet" href="../shared/page-title.css">
<script defer src="../shared/page-title.js"></script>
</head>
<body>
  <canvas id="bgCanvas"></canvas>
  <div class="center-glow"></div>

  <div class="stage">
    <page-title eyebrow="Chapter 04" title="Regression <em>Models</em>"></page-title>

    <div class="center">
      <div class="accent-rule"></div>
      <div class="eyebrow">Machine Learning Models</div>
      <h1 class="title">Multiple Linear<br><em>Regression</em></h1>
      <div class="subtitle">from one variable to many</div>
    </div>
  </div>

  <div class="bottom-eq" onclick="this.classList.toggle('highlighted')">
    <span>ŷ</span> = f( x₁, x₂, x₃, …, xₙ )
  </div>

<script>
  /* ═══════════════════════════════════════════════
     Animated background: floating grid + symbols
     ═══════════════════════════════════════════════ */
  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');
  let W, H, dpr;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  // Floating math symbols
  const SYMBOLS = ['x₁', 'x₂', 'x₃', 'w₀', 'w₁', 'wₙ', 'Σ', 'ε', 'ŷ', '∂', '∇', 'θ'];
  const particles = [];
  const PARTICLE_COUNT = 18;

  function getColors() {
    const cs = getComputedStyle(document.documentElement);
    return {
      fg: cs.getPropertyValue('--fg').trim() || '#f1f5fb',
      accent: cs.getPropertyValue('--accent').trim() || '#a3e635',
      bg: cs.getPropertyValue('--bg').trim() || '#0a1428',
    };
  }

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push({
      x: Math.random() * 1920,
      y: Math.random() * 1080,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.2,
      symbol: SYMBOLS[i % SYMBOLS.length],
      size: 14 + Math.random() * 12,
      opacity: 0.04 + Math.random() * 0.06,
      phase: Math.random() * Math.PI * 2,
    });
  }

  // Perspective grid dots
  const gridDots = [];
  const GRID_COLS = 28;
  const GRID_ROWS = 16;
  for (let r = 0; r < GRID_ROWS; r++) {
    for (let c = 0; c < GRID_COLS; c++) {
      gridDots.push({
        baseX: (c / (GRID_COLS - 1)) * 1920,
        baseY: (r / (GRID_ROWS - 1)) * 1080,
        phase: (c + r * 0.7) * 0.4,
      });
    }
  }

  let time = 0;
  function draw() {
    time += 0.008;
    ctx.clearRect(0, 0, W, H);
    const colors = getColors();

    // Parse accent for rgba
    let ar = 163, ag = 230, ab = 53;
    if (colors.accent.startsWith('#') && colors.accent.length >= 7) {
      ar = parseInt(colors.accent.slice(1, 3), 16);
      ag = parseInt(colors.accent.slice(3, 5), 16);
      ab = parseInt(colors.accent.slice(5, 7), 16);
    }

    // Parse fg for rgba
    let fr = 241, fg2 = 245, fb = 251;
    if (colors.fg.startsWith('#') && colors.fg.length >= 7) {
      fr = parseInt(colors.fg.slice(1, 3), 16);
      fg2 = parseInt(colors.fg.slice(3, 5), 16);
      fb = parseInt(colors.fg.slice(5, 7), 16);
    }

    // Draw grid dots
    const cx = W / 2;
    const cy = H / 2;
    for (const dot of gridDots) {
      const nx = (dot.baseX / 1920) * W;
      const ny = (dot.baseY / 1080) * H;
      const wave = Math.sin(dot.phase + time * 1.2) * 2;
      const dx = nx - cx;
      const dy = ny - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const maxDist = Math.sqrt(cx * cx + cy * cy);
      const distFade = 1 - Math.pow(dist / maxDist, 1.5);
      const opacity = 0.025 * distFade + 0.01;

      ctx.beginPath();
      ctx.arc(nx, ny + wave, 1.2, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${fr}, ${fg2}, ${fb}, ${opacity})`;
      ctx.fill();
    }

    // Draw floating symbols
    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy;

      // Wrap around
      if (p.x < -50) p.x = W + 50;
      if (p.x > W + 50) p.x = -50;
      if (p.y < -50) p.y = H + 50;
      if (p.y > H + 50) p.y = -50;

      const breathe = Math.sin(time * 2 + p.phase) * 0.015 + p.opacity;

      ctx.save();
      ctx.globalAlpha = breathe;
      ctx.font = `${p.size}px 'STIX Two Math', 'Cormorant Garamond', serif`;
      ctx.fillStyle = `rgba(${ar}, ${ag}, ${ab}, 1)`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.symbol, p.x, p.y);
      ctx.restore();
    }

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  /* ═══════════════════════════════
     Theme sync (parent deck)
     ═══════════════════════════════ */
  const PALETTE_SETS = {
    'Warm Linen':  { bg: '#f3f1e9', fg: '#1c1c1c', accent: '#e27b5e', accent2: '#4a8bdd', rule: 'rgba(28,28,28,0.14)', muted: 'rgba(28,28,28,0.55)' },
    'Green Linen': { bg: '#f3f1e9', fg: '#1c1c1c', accent: '#2e8b57', accent2: '#4a8bdd', rule: 'rgba(28,28,28,0.14)', muted: 'rgba(28,28,28,0.55)' },
    'Paper White': { bg: '#ffffff', fg: '#111111', accent: '#d0465a', accent2: '#0369a1', rule: 'rgba(17,17,17,0.12)', muted: 'rgba(17,17,17,0.55)' },
    'Midnight':    { bg: '#000000', fg: '#f0ece4', accent: '#f59e0b', accent2: '#5fb8e6', rule: 'rgba(240,236,228,0.14)', muted: 'rgba(240,236,228,0.55)' },
    'Navy Lime':   { bg: '#0a1428', fg: '#f1f5fb', accent: '#a3e635', accent2: '#5fb8e6', rule: 'rgba(241,245,251,0.14)', muted: 'rgba(241,245,251,0.55)' },
  };

  function applyPalette(name) {
    const set = PALETTE_SETS[name] || PALETTE_SETS['Navy Lime'];
    const root = document.documentElement;
    root.style.setProperty('--bg', set.bg);
    root.style.setProperty('--fg', set.fg);
    root.style.setProperty('--accent', set.accent);
    root.style.setProperty('--accent-2', set.accent2);
    root.style.setProperty('--rule', set.rule);
    root.style.setProperty('--muted', set.muted);
  }

  window.addEventListener('message', (e) => {
    const data = e.data || {};
    if (data.type !== 'SET_THEME') return;
    const name = data.palette
      || (data.mode === 'dark' ? 'Navy Lime' : 'Warm Linen');
    applyPalette(name);
  });

  // Forward arrow-key navigation to the parent deck when this iframe has focus.
  document.addEventListener('keydown', (e) => {
    if (window.parent === window) return;
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(e.key)) {
      e.preventDefault();
      window.parent.postMessage({ type: 'NAV', dir: 'next' }, '*');
    } else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) {
      e.preventDefault();
      window.parent.postMessage({ type: 'NAV', dir: 'prev' }, '*');
    }
  });
</script>
</body>
</html>

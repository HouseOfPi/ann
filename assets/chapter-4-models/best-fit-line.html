<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Best Fit Line | Presentation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=STIX+Two+Math&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #000000;
      --fg: #eef2f8;
      --accent: #c97a4a;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      padding: 32px 50px 40px;
      transition: background 0.5s, color 0.5s;
    }

    .body {
      flex: 1;
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      width: 100%;
      gap: 60px;
      padding: 0 40px;
    }

    .controls-container {
      width: 580px;
      height: 540px;
      padding: 40px 36px;
      border-radius: 20px;
      background: color-mix(in srgb, var(--fg) 3%, transparent);
      border: 1px solid color-mix(in srgb, var(--fg) 10%, transparent);
      box-shadow: 0 20px 50px -25px color-mix(in srgb, var(--bg) 70%, transparent);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 36px;
      flex-shrink: 0;
    }

    .description {
      font-size: 14.5px;
      line-height: 1.6;
      color: color-mix(in srgb, var(--fg) 80%, transparent);
    }
    .description strong {
      color: var(--accent);
      font-weight: 600;
    }

    .equation-box {
      background: color-mix(in srgb, var(--fg) 2%, transparent);
      border: 1px dashed color-mix(in srgb, var(--fg) 12%, transparent);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      font-family: 'STIX Two Math', 'Cormorant Garamond', serif;
      font-size: 24px;
      color: var(--fg);
    }
    .equation-box span.highlight {
      color: var(--accent);
      font-weight: 600;
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: color-mix(in srgb, var(--fg) 60%, transparent);
    }
    .slider-header span.val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: var(--accent);
    }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 6px;
      background: linear-gradient(to right, 
        var(--accent) 0%, 
        var(--accent) var(--pct, 0%), 
        color-mix(in srgb, var(--fg) 12%, transparent) var(--pct, 0%), 
        color-mix(in srgb, var(--fg) 12%, transparent) 100%
      );
      border-radius: 3px;
      outline: none;
      transition: box-shadow 0.2s ease;
    }
    input[type=range]:hover {
      box-shadow: 0 0 6px color-mix(in srgb, var(--accent) 15%, transparent);
    }
    input[type=range]:active {
      box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 30%, transparent);
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), background-color 0.15s, box-shadow 0.15s;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
      background-color: color-mix(in srgb, var(--accent) 90%, #ffffff);
      box-shadow: 0 2px 10px color-mix(in srgb, var(--accent) 30%, rgba(0,0,0,0.3));
    }
    input[type=range]::-webkit-slider-thumb:active {
      transform: scale(1.35);
      background-color: color-mix(in srgb, var(--accent) 75%, #ffffff);
      box-shadow: 0 2px 14px color-mix(in srgb, var(--accent) 60%, rgba(0,0,0,0.3));
    }

    .loss-section {
      background: color-mix(in srgb, var(--fg) 3%, transparent);
      border-radius: 12px;
      padding: 12px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border: 1px solid color-mix(in srgb, var(--fg) 8%, transparent);
    }
    .loss-header {
      display: flex;
      align-items: center;
    }
    .loss-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: color-mix(in srgb, var(--fg) 60%, transparent);
    }
    .loss-display {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .loss-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 24px;
      font-weight: 800;
      transition: color 0.3s ease;
    }
    .loss-status {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 3px 8px;
      border-radius: 6px;
      transition: all 0.3s ease;
    }
    
    .loss-good { color: #10b981; }
    .loss-good-bg { background: rgba(16, 185, 129, 0.12); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }
    .loss-warn { color: #f59e0b; }
    .loss-warn-bg { background: rgba(245, 158, 11, 0.12); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.2); }
    .loss-bad { color: #ef4444; }
    .loss-bad-bg { background: rgba(239, 68, 68, 0.12); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); }

    .action-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 4px;
    }
    
    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 13.5px;
      font-weight: 600;
      color: color-mix(in srgb, var(--fg) 80%, transparent);
      user-select: none;
    }
    .checkbox-container input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .fit-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 10px;
      background: var(--accent);
      color: var(--bg);
      font-family: 'Inter', sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 30%, transparent);
    }
    .fit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 45%, transparent);
      filter: brightness(1.08);
    }
    .fit-btn:active {
      transform: translateY(0);
    }
    .fit-btn svg {
      width: 15px;
      height: 15px;
    }

    .chart-container-outer {
      width: 680px;
      height: 540px;
      border-radius: 20px;
      background: color-mix(in srgb, var(--fg) 3%, transparent);
      border: 1px solid color-mix(in srgb, var(--fg) 10%, transparent);
      box-shadow: 0 20px 50px -25px color-mix(in srgb, var(--bg) 70%, transparent);
      padding: 24px 32px 32px;
      position: relative;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }

    /* Clickable axis labels — kept as plain text */
    .axis-label {
      cursor: pointer;
      user-select: none;
    }

    /* Formula overlay — clean squared-error annotation */
    .formula-overlay {
      position: absolute;
      font-family: 'STIX Two Math', 'Cormorant Garamond', serif;
      font-size: 24px;
      color: var(--accent);
      z-index: 100;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -60%);
      transition: color 0.5s;
      padding: 6px 14px;
      border-radius: 8px;
      background: color-mix(in srgb, var(--bg) 75%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      white-space: nowrap;
    }
    .formula-overlay.show {
      transform: translate(-50%, -50%);
    }
    .formula-overlay {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    /* GSAP owns all formula-overlay piece animations — no CSS transitions here */
    .formula-overlay .fo-label {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: color-mix(in srgb, var(--accent) 80%, var(--fg));
      overflow: hidden;
    }
    .formula-overlay .fo-body {
      line-height: 1;
      position: relative;
    }
    .formula-overlay .fo-body > .fo-term { display: inline-block; }
    .formula-overlay .fo-mse {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .formula-overlay sub {
      font-size: 15px;
      font-style: italic;
      color: color-mix(in srgb, var(--accent) 70%, var(--fg));
    }
    .formula-overlay sup {
      font-size: 16px;
      top: -0.6em;
    }
    /* 1/n fraction layout (GSAP handles opacity/width) */
    .formula-overlay .fo-frac {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      font-size: 20px;
      line-height: 1.1;
      vertical-align: middle;
      overflow: hidden;
    }
    .formula-overlay .fo-num {
      border-bottom: 1.5px solid color-mix(in srgb, var(--accent) 60%, transparent);
      padding: 0 6px;
    }
    .formula-overlay .fo-den { padding: 0 6px; }
    .formula-overlay .fo-sigma {
      font-size: 30px;
      line-height: 1;
    }
  </style>
  <link rel="stylesheet" href="../shared/page-title.css">
  <script defer src="../shared/page-title.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
</head>
<body>
  <page-title id="header" eyebrow="Machine Learning Models" title="The Best Fit <em>Line</em>"></page-title>

  <div class="body">
    <div class="controls-container">

      <div class="equation-box">
        ŷ = <span class="highlight">w</span> · x + <span class="highlight">b</span>
      </div>

      <div class="slider-group">
        <div class="slider-header">
          <span>Weight (w)</span>
          <span id="val-w" class="val">8.32</span>
        </div>
        <div class="slider-row">
          <input type="range" id="slide-w" min="0" max="25" step="0.01" value="8.32" oninput="hasStarted=true; updateLine()">
        </div>
      </div>

      <div class="slider-group">
        <div class="slider-header">
          <span>Bias (b)</span>
          <span id="val-b" class="val">9.8</span>
        </div>
        <div class="slider-row">
          <input type="range" id="slide-b" min="-200" max="100" step="0.1" value="9.8" oninput="hasStarted=true; updateLine()">
        </div>
      </div>

      <div class="action-row">
        <label class="checkbox-container">
          <input type="checkbox" id="show-residuals" onchange="toggleResiduals()">
          Show Error Residuals
        </label>
      </div>
    </div>

    <div class="chart-container-outer" style="position: relative; margin-top: 15px; padding-top: 32px;">
      <div style="position: relative; flex: 1; min-height: 400px; width: 100%;">
        <div id="y-axis-label" class="axis-label" style="position: absolute; top: -16px; left: 30px; font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600; color: var(--fg); z-index: 10;" title="Click to toggle axis values">
          Ice Creams Sold
        </div>
        <div id="x-axis-label" class="axis-label" style="position: absolute; bottom: 5px; right: 15px; font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600; color: var(--fg); z-index: 10;" title="Click to toggle axis values">
          Temperature (°C)
        </div>
        <canvas id="scatterChart" style="cursor: pointer;"></canvas>
        <div id="formula-overlay" class="formula-overlay">
          <span class="fo-label">Mean Squared Error</span>
          <span class="fo-body">
            <!-- Single squared-error term -->
            <span class="fo-term">( y<sub>i</sub> &minus; ŷ<sub>i</sub> )<sup>2</sup></span>
            <!-- Full MSE: 1/n Σ (yi − ŷi)^2 -->
            <span class="fo-mse">
              <span class="fo-frac"><span class="fo-num">1</span><span class="fo-den">n</span></span>
              <span class="fo-sigma">&sum;</span>
              <span class="fo-term">( y<sub>i</sub> &minus; ŷ<sub>i</sub> )<sup>2</sup></span>
            </span>
          </span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const rawData = [
      [18.2, 105], [18.6, 155], [21.7, 210], [22.3, 150],
      [22.8, 235], [25.4, 170], [27.2, 280], [27.7, 210],
      [28.2, 245], [29.1, 320], [29.7, 250], [30.9, 345],
      [32.5, 310], [32.7, 275], [36.2, 360], [36.6, 330],
      [37.7, 315], [38.4, 395], [40.1, 410], [40.7, 380],
      [41.6, 470]
    ];

    const chartPoints = rawData.map(p => ({ x: p[0], y: p[1] }));
    const bestFitW = 12.11;
    const bestFitB = -86.00;
    let scatterChart;
    let hasStarted = false;
    let showResiduals = false;
    let currentW = 8.32;
    let currentB = 9.8;
    let selectedPointIndex = -1;

    // Custom plugin to draw vertical residual/error lines
    let showCrossAt35 = false;
    // Hover state for the green dot (shows sales value)
    let hoverGreenDot = false;
    // Hover state for the blue cross on the line
    let hoverBlueCross = false;
    // 0=hidden, 1=term (yi−ŷi)^2, 2=Σ term, 3=1/n Σ term, 4=+ "Mean Squared Error" label
    let formulaState = 0;

    const residualsPlugin = {
      id: 'residualsPlugin',
      afterDatasetsDraw: (chart) => {
        const ctx = chart.ctx;
        const xAxis = chart.scales.x;
        const yAxis = chart.scales.y;
        if (!xAxis || !yAxis) return;

        ctx.save();

        // Green dot marker on the regression line at x = 35
        if (showCrossAt35 && hasStarted) {
          const x35 = 35;
          const yOnLine = currentW * x35 + currentB;
          const px = xAxis.getPixelForValue(x35);
          const py = yAxis.getPixelForValue(yOnLine);
          const radius = 8;

          // Dotted guide lines from the green dot down to x-axis and left to y-axis
          ctx.strokeStyle = '#10b981';
          ctx.lineWidth = 1.5;
          ctx.setLineDash([5, 5]);
          ctx.beginPath();
          ctx.moveTo(px, py);
          ctx.lineTo(px, yAxis.bottom);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(px, py);
          ctx.lineTo(xAxis.left, py);
          ctx.stroke();

          ctx.setLineDash([]);

          // White halo for legibility against the line
          ctx.beginPath();
          ctx.arc(px, py, radius + 3, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.fill();

          // Green dot (enlarges slightly on hover)
          const dotRadius = hoverGreenDot ? radius + 2 : radius;
          ctx.beginPath();
          ctx.arc(px, py, dotRadius, 0, Math.PI * 2);
          ctx.fillStyle = '#10b981';
          ctx.fill();
          ctx.strokeStyle = '#047857';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // Hover tooltip — show the predicted sales value
          if (hoverGreenDot) {
            const label = 'Sales: 340';
            ctx.font = "700 14px 'Inter', sans-serif";
            const padX = 10, padY = 7;
            const textW = ctx.measureText(label).width;
            const boxW = textW + padX * 2;
            const boxH = 28;
            const boxX = px - boxW / 2;
            const boxY = py - dotRadius - 12 - boxH;

            // Tooltip card
            ctx.fillStyle = '#10b981';
            ctx.beginPath();
            const r = 7;
            ctx.moveTo(boxX + r, boxY);
            ctx.arcTo(boxX + boxW, boxY, boxX + boxW, boxY + boxH, r);
            ctx.arcTo(boxX + boxW, boxY + boxH, boxX, boxY + boxH, r);
            ctx.arcTo(boxX, boxY + boxH, boxX, boxY, r);
            ctx.arcTo(boxX, boxY, boxX + boxW, boxY, r);
            ctx.closePath();
            ctx.fill();

            // Pointer triangle
            ctx.beginPath();
            ctx.moveTo(px - 6, boxY + boxH);
            ctx.lineTo(px + 6, boxY + boxH);
            ctx.lineTo(px, boxY + boxH + 7);
            ctx.closePath();
            ctx.fill();

            // Label text
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, px, boxY + boxH / 2);
          }
        }
        
        if (showResiduals) {
          ctx.strokeStyle = '#ef4444';
          ctx.lineWidth = 1.2;
          ctx.setLineDash([3, 3]);

          rawData.forEach((pt, idx) => {
            if (idx === selectedPointIndex) return; // skip selected
            const x = pt[0];
            const y = pt[1];
            const yHat = currentW * x + currentB;

            const xPixel = xAxis.getPixelForValue(x);
            const yPixelActual = yAxis.getPixelForValue(y);
            const yPixelPred = yAxis.getPixelForValue(yHat);

            ctx.beginPath();
            ctx.moveTo(xPixel, yPixelActual);
            ctx.lineTo(xPixel, yPixelPred);
            ctx.stroke();
          });
        }

        // Draw selected point details
        if (selectedPointIndex >= 0) {
            const pt = rawData[selectedPointIndex];
            const x = pt[0];
            const y = pt[1];
            const yHat = currentW * x + currentB;
            
            const xPixel = xAxis.getPixelForValue(x);
            const yPixelActual = yAxis.getPixelForValue(y);
            const yPixelPred = yAxis.getPixelForValue(yHat);
            const yAxisRightEdge = xAxis.left; // x coordinate of the y-axis

            // Draw thicker error line for selected point
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 2.5;
            ctx.setLineDash([]);
            ctx.beginPath();
            ctx.moveTo(xPixel, yPixelActual);
            ctx.lineTo(xPixel, yPixelPred);
            ctx.stroke();

            // Draw a blue cross 'X' at the predicted point on the regression line
            const crossSize = hoverBlueCross ? 10.5 : 7;
            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = hoverBlueCross ? 4.5 : 3;
            ctx.beginPath();
            ctx.moveTo(xPixel - crossSize, yPixelPred - crossSize);
            ctx.lineTo(xPixel + crossSize, yPixelPred + crossSize);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(xPixel - crossSize, yPixelPred + crossSize);
            ctx.lineTo(xPixel + crossSize, yPixelPred - crossSize);
            ctx.stroke();
            
            // Draw horizontal dashed line for actual y
            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(xPixel, yPixelActual);
            ctx.lineTo(yAxisRightEdge, yPixelActual);
            ctx.stroke();
            
            // Draw horizontal dashed line for predicted y
            ctx.strokeStyle = '#6b7280';
            ctx.beginPath();
            ctx.moveTo(xPixel, yPixelPred);
            ctx.lineTo(yAxisRightEdge, yPixelPred);
            ctx.stroke();
            
            // Add y_i label
            ctx.fillStyle = '#3b82f6';
            ctx.font = "italic bold 17px 'Inter', sans-serif";
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            ctx.fillText("y\u1D62", yAxisRightEdge - 8, yPixelActual);
            
            // Add y_hat_i label
            ctx.fillStyle = '#6b7280';
            ctx.fillText("\u0177\u1D62", yAxisRightEdge - 8, yPixelPred);
            
            // Add diff text explicitly next to the error line
            ctx.fillStyle = '#ef4444';
            ctx.font = "italic bold 17px 'Inter', sans-serif";
            ctx.textAlign = 'left';
            const diffText = "e\u1D62";
            const midY = (yPixelActual + yPixelPred) / 2;
            ctx.fillText(diffText, xPixel + 8, midY);
        }

        // Position overlay (only geometry — classes are set by updateFormulaOverlay)
        const overlay = document.getElementById('formula-overlay');
        if (overlay && formulaState > 0) {
          const axisWidth = xAxis.right - xAxis.left;
          const centerX = (xAxis.left + xAxis.right) / 2 + axisWidth * 0.1;
          const centerY = yAxis.top - 24;
          overlay.style.left = `${centerX}px`;
          overlay.style.top = `${centerY}px`;
        }

        ctx.restore();
      }
    };

    function updateFormulaOverlay() {
      const overlay = document.getElementById('formula-overlay');
      if (!overlay) return;

      const term  = overlay.querySelector('.fo-body > .fo-term');
      const mse   = overlay.querySelector('.fo-mse');
      const frac  = overlay.querySelector('.fo-frac');
      const label = overlay.querySelector('.fo-label');

      // Cancel any running transitions on elements to prevent conflicts
      gsap.killTweensOf([term, mse, frac, label]);
      gsap.set([term, mse, frac, label], { clearProps: "all" });

      if (formulaState === 0) {
        // Hide everything
        gsap.to(overlay, { opacity: 0, scale: 0.88, duration: 0.3, ease: 'power2.in',
          onComplete: () => overlay.classList.remove('show') });
        return;
      }

      // Ensure chip is visible
      if (!overlay.classList.contains('show')) {
        overlay.classList.add('show');
        gsap.fromTo(overlay, { opacity: 0, scale: 0.88 }, { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(1.4)' });
      } else {
        gsap.to(overlay, { opacity: 1, scale: 1, duration: 0.2 });
      }

      if (formulaState === 1) {
        // Show bare squared-error term, hide MSE block and label
        gsap.set(mse, { display: 'none' });
        gsap.set(term, { display: 'inline-block', opacity: 1, y: 0 });
        gsap.set(label, { display: 'none' });
      } else if (formulaState === 2) {
        // Show Sum (y_i - ŷ_i)^2 (hide 1/n fraction and label)
        gsap.set(term, { display: 'none' });
        gsap.set(mse, { display: 'inline-flex', opacity: 1, y: 0 });
        gsap.set(frac, { display: 'none' });
        gsap.set(label, { display: 'none' });
      } else if (formulaState === 3) {
        // Show 1/n Sum (y_i - ŷ_i)^2 (hide label)
        gsap.set(term, { display: 'none' });
        gsap.set(mse, { display: 'inline-flex', opacity: 1, y: 0 });
        gsap.set(frac, { display: 'inline-flex', opacity: 1, width: 'auto', marginRight: 0 });
        gsap.set(label, { display: 'none' });
      } else if (formulaState === 4) {
        // Show label + 1/n Sum (y_i - ŷ_i)^2
        gsap.set(term, { display: 'none' });
        gsap.set(mse, { display: 'inline-flex', opacity: 1, y: 0 });
        gsap.set(frac, { display: 'inline-flex', opacity: 1, width: 'auto', marginRight: 0 });
        gsap.set(label, { display: 'block', opacity: 1, height: 'auto', marginBottom: 4 });
      }
    }

    function getLineDataPoints(w, b) {
      if (!hasStarted) return [];
      // Draw line from x = 15 to x = 45
      return [
        { x: 15, y: w * 15 + b },
        { x: 45, y: w * 45 + b }
      ];
    }

    function updateSliderTrack(el) {
      if (!el) return;
      const min = parseFloat(el.min || 0);
      const max = parseFloat(el.max || 100);
      const val = parseFloat(el.value);
      const pct = ((val - min) / (max - min)) * 100;
      el.style.setProperty('--pct', `${pct}%`);
    }

    function updateLine() {
      const slideW = document.getElementById('slide-w');
      const slideB = document.getElementById('slide-b');
      currentW = parseFloat(slideW.value);
      currentB = parseFloat(slideB.value);

      // Update track fill progress
      updateSliderTrack(slideW);
      updateSliderTrack(slideB);

      // Update UI displays
      document.getElementById('val-w').textContent = currentW.toFixed(2);
      document.getElementById('val-b').textContent = currentB.toFixed(1);

      if (!hasStarted) return;

      // Update Line in chart
      if (scatterChart) {
        scatterChart.data.datasets[1].data = getLineDataPoints(currentW, currentB);
        scatterChart.update('none'); // Update without full entry animation
      }
    }

    function toggleResiduals() {
      showResiduals = document.getElementById('show-residuals').checked;
      if (scatterChart) {
        scatterChart.update('none');
      }
    }

    let animInterval = null;
    function animateToBestFit() {
      hasStarted = true;
      if (animInterval) clearInterval(animInterval);

      const startW = currentW;
      const startB = currentB;
      const steps = 90;
      let step = 0;

      animInterval = setInterval(() => {
        step++;
        const t = step / steps;
        
        // Easing: easeInOutQuad
        const ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;

        const w = startW + (bestFitW - startW) * ease;
        const b = startB + (bestFitB - startB) * ease;

        document.getElementById('slide-w').value = w;
        document.getElementById('slide-b').value = b;

        updateLine();

        if (step >= steps) {
          clearInterval(animInterval);
          animInterval = null;
        }
      }, 20);
    }

    function initChart() {
      const canvas = document.getElementById('scatterChart');
      const ctx = canvas.getContext('2d');
      const rootStyles = getComputedStyle(document.documentElement);
      const fgColor = rootStyles.getPropertyValue('--fg').trim() || '#eef2f8';
      const accentColor = rootStyles.getPropertyValue('--accent').trim() || '#c97a4a';

      scatterChart = new Chart(ctx, {
        type: 'scatter',
        data: {
          datasets: [
            {
              label: 'Ice Cream Sales',
              data: chartPoints,
              backgroundColor: accentColor,
              borderColor: accentColor,
              pointRadius: 5.5,
              pointHoverRadius: 8.5,
              pointBackgroundColor: colorMix(accentColor, 'transparent', 0.2),
              zIndex: 3
            },
            {
              label: 'Regression Line',
              data: getLineDataPoints(currentW, currentB),
              type: 'line',
              borderColor: accentColor,
              borderWidth: 3,
              fill: false,
              pointRadius: 0,
              pointHoverRadius: 0,
              showLine: true,
              zIndex: 2
            }
          ]
        },
        options: {
          layout: { padding: { left: 30, top: 32, bottom: 20, right: 10 } },
          responsive: true,
          maintainAspectRatio: false,
          animation: { duration: 1000, easing: 'easeOutQuart' },
          onClick: (event, elements) => {
            if (!hasStarted) {
              hasStarted = true;
              updateLine();
              return;
            }

            if (elements.length > 0) {
              const datasetIndex = elements[0].datasetIndex;
              if (datasetIndex === 0) {
                const index = elements[0].index;
                selectedPointIndex = (selectedPointIndex === index) ? -1 : index;
                scatterChart.update('none');
              }
            } else {
              selectedPointIndex = -1;
              scatterChart.update('none');
            }
          },
          onHover: (event, elements) => {
            if (event.native && event.native.target) {
                event.native.target.style.cursor = (elements.length > 0 && elements[0].datasetIndex === 0) ? 'pointer' : 'default';
            }
          },
          plugins: {
            legend: { display: false },
            tooltip: { enabled: false }
          },
          scales: {
            x: {
              type: 'linear',
              min: 15,
              max: 45,
              title: { display: false, text: 'Temperature (°C)', color: fgColor, font: { family: 'Inter', size: 15, weight: 600 } },
              ticks: { display: false, stepSize: 5, color: fgColor, font: { family: 'Inter', size: 12.5, weight: 500 } },
              grid: { color: colorMix(fgColor, 'transparent', 0.85), borderDash: [2, 2] }
            },
            y: {
              min: 50,
              max: 500,
              title: { display: false, text: 'Ice Creams Sold', color: fgColor, font: { family: 'Inter', size: 15, weight: 600 } },
              ticks: { display: false, stepSize: 50, color: fgColor, font: { family: 'Inter', size: 12.5, weight: 500 } },
              grid: { color: colorMix(fgColor, 'transparent', 0.85), borderDash: [2, 2] }
            }
          }
        },
        plugins: [residualsPlugin]
      });

      updateLine();
    }

    // Helper to simulate CSS color-mix for ChartJS
    function colorMix(hex, ignored, alpha) {
      if(hex.startsWith('#')) {
         const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
         return `rgba(${r},${g},${b},${1-alpha})`;
      }
      return hex;
    }

    function parseHex(hex) {
      const cleanHex = hex.trim();
      if (cleanHex.startsWith('#')) {
        if (cleanHex.length === 4) {
          const r = parseInt(cleanHex[1] + cleanHex[1], 16);
          const g = parseInt(cleanHex[2] + cleanHex[2], 16);
          const b = parseInt(cleanHex[3] + cleanHex[3], 16);
          return { r, g, b };
        } else {
          const r = parseInt(cleanHex.slice(1, 3), 16);
          const g = parseInt(cleanHex.slice(3, 5), 16);
          const b = parseInt(cleanHex.slice(5, 7), 16);
          return { r, g, b };
        }
      }
      return { r: 238, g: 242, b: 248 };
    }

    function interpolateColor(color1Hex, color2Hex, factor) {
      const c1 = parseHex(color1Hex);
      const c2 = parseHex(color2Hex);
      const r = Math.round(c1.r + (c2.r - c1.r) * factor);
      const g = Math.round(c1.g + (c2.g - c1.g) * factor);
      const b = Math.round(c1.b + (c2.b - c1.b) * factor);
      return `rgb(${r},${g},${b})`;
    }

    function updateChartColors() {
      if (!scatterChart) return;
      const rootStyles = getComputedStyle(document.documentElement);
      const fgColor = rootStyles.getPropertyValue('--fg').trim();
      const accentColor = rootStyles.getPropertyValue('--accent').trim();
      const bgColor = rootStyles.getPropertyValue('--bg').trim();

      scatterChart.data.datasets[0].backgroundColor = colorMix(accentColor, 'transparent', 0.2);
      scatterChart.data.datasets[0].borderColor = accentColor;
      scatterChart.data.datasets[1].borderColor = accentColor;
      
      scatterChart.options.scales.x.title.color = fgColor;
      scatterChart.options.scales.y.title.color = fgColor;
      scatterChart.options.scales.x.ticks.color = fgColor;
      scatterChart.options.scales.y.ticks.color = fgColor;
      scatterChart.options.scales.x.grid.color = colorMix(fgColor, 'transparent', 0.85);
      scatterChart.options.scales.y.grid.color = colorMix(fgColor, 'transparent', 0.85);

      if (scatterChart.options.plugins && scatterChart.options.plugins.tooltip) {
        const tooltip = scatterChart.options.plugins.tooltip;
        tooltip.backgroundColor = interpolateColor(bgColor, fgColor, 0.08);
        tooltip.borderColor = colorMix(accentColor, 'transparent', 0.5);
        tooltip.titleColor = accentColor;
        tooltip.bodyColor = fgColor;
      }

      scatterChart.update();
    }

    window.addEventListener('DOMContentLoaded', initChart);

    // Chart — double-click to auto-fit
    window.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('scatterChart');
      if (canvas) {
        canvas.addEventListener('dblclick', () => {
          if (typeof animateToBestFit === 'function') animateToBestFit();
        });

        // Native click — detect tap on the "35" x-axis tick label.
        // Uses click position relative to the chart canvas; matches X=35
        // pixel and a generous band below the chart area.
        canvas.addEventListener('click', (e) => {
          if (!scatterChart) return;
          const xAxis = scatterChart.scales.x;
          const yAxis = scatterChart.scales.y;
          if (!xAxis || !yAxis) return;
          const rect = canvas.getBoundingClientRect();
          const localX = e.clientX - rect.left;
          const localY = e.clientY - rect.top;

          // Top-left corner click — cycle: off → term → Σ term → 1/n Σ term → +label → off
          if (localX < xAxis.left && localY < yAxis.top) {
            formulaState = (formulaState + 1) % 5;
            updateFormulaOverlay();
            scatterChart.update('none');
            return;
          }

          const x35Px = xAxis.getPixelForValue(35);
          // Tick label band: from just above x-axis bottom edge to end of canvas
          const tickBandTop = yAxis.bottom - 2;
          const tickBandBottom = rect.height;
          const inTickBand = localY >= tickBandTop && localY <= tickBandBottom;
          const nearX35 = Math.abs(localX - x35Px) < 24;
          if (inTickBand && nearX35) {
            showCrossAt35 = !showCrossAt35;
            scatterChart.update('none');
          }
        });

        // Hover over the green dot (at x=35 on the line) or the blue cross (when selected)
        canvas.addEventListener('mousemove', (e) => {
          if (!scatterChart) return;
          const xAxis = scatterChart.scales.x;
          const yAxis = scatterChart.scales.y;
          if (!xAxis || !yAxis) return;
          const rect = canvas.getBoundingClientRect();
          const localX = e.clientX - rect.left;
          const localY = e.clientY - rect.top;

          let isOverGreenDot = false;
          let isOverBlueCross = false;

          // 1. Check Green Dot hover
          if (showCrossAt35 && hasStarted) {
            const px = xAxis.getPixelForValue(35);
            const py = yAxis.getPixelForValue(currentW * 35 + currentB);
            const dist = Math.hypot(localX - px, localY - py);
            isOverGreenDot = dist <= 14;
          }

          // 2. Check Blue Cross hover
          if (selectedPointIndex >= 0) {
            const pt = rawData[selectedPointIndex];
            const x = pt[0];
            const yHat = currentW * x + currentB;
            const px = xAxis.getPixelForValue(x);
            const py = yAxis.getPixelForValue(yHat);
            const dist = Math.hypot(localX - px, localY - py);
            isOverBlueCross = dist <= 14;
          }

          let stateChanged = false;

          if (isOverGreenDot !== hoverGreenDot) {
            hoverGreenDot = isOverGreenDot;
            stateChanged = true;
          }

          if (isOverBlueCross !== hoverBlueCross) {
            hoverBlueCross = isOverBlueCross;
            stateChanged = true;
          }

          if (stateChanged) {
            canvas.style.cursor = (hoverGreenDot || hoverBlueCross) ? 'pointer' : 'default';
            scatterChart.update('none');
          }
        });

        canvas.addEventListener('mouseleave', () => {
          let stateChanged = false;
          if (hoverGreenDot) { hoverGreenDot = false; stateChanged = true; }
          if (hoverBlueCross) { hoverBlueCross = false; stateChanged = true; }
          if (stateChanged && scatterChart) {
            canvas.style.cursor = 'default';
            scatterChart.update('none');
          }
        });
      }

      // Axis labels — click toggles BOTH axis tick values together
      const toggleBothAxisTicks = () => {
        if (!scatterChart) return;
        const xScale = scatterChart.options.scales.x;
        const yScale = scatterChart.options.scales.y;
        if (!xScale || !yScale) return;
        const currentlyVisible = xScale.ticks && xScale.ticks.display !== false;
        const next = !currentlyVisible;
        xScale.ticks = { ...(xScale.ticks || {}), display: next };
        yScale.ticks = { ...(yScale.ticks || {}), display: next };
        scatterChart.update('none');
      };
      const xLabel = document.getElementById('x-axis-label');
      const yLabel = document.getElementById('y-axis-label');
      if (xLabel) xLabel.addEventListener('click', toggleBothAxisTicks);
      if (yLabel) yLabel.addEventListener('click', toggleBothAxisTicks);
    });

    // Theme alignment logic
    const PALETTE_SETS = {
      'Warm Linen':  { bg: '#f3f1e9', fg: '#1c1c1c', accent: '#b84c30' },
      'Green Linen': { bg: '#f3f1e9', fg: '#1c1c1c', accent: '#166534' },
      'Paper White': { bg: '#ffffff', fg: '#111111', accent: '#c23348' },
      'Midnight':    { bg: '#000000', fg: '#f0ece4', accent: '#f59e0b' },
      'Navy Lime':   { bg: '#0a1428', fg: '#f1f5fb', accent: '#a3e635' },
    };

    function applyPalette(name) {
      const set = PALETTE_SETS[name] || PALETTE_SETS['Navy Lime'];
      const root = document.documentElement;
      root.style.setProperty('--bg', set.bg);
      root.style.setProperty('--fg', set.fg);
      root.style.setProperty('--accent', set.accent);
      setTimeout(updateChartColors, 50);
    }

    window.addEventListener('message', (e) => {
      const data = e.data || {};
      if (data.type !== 'SET_THEME') return;
      const name = data.palette || (data.mode === 'dark' ? 'Navy Lime' : 'Warm Linen');
      applyPalette(name);
    });

  </script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Linear Regression | Presentation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=STIX+Two+Math&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #000000;
      --fg: #eef2f8;
      --accent: #c97a4a;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      padding: 32px 50px 40px;
      transition: background 0.5s, color 0.5s;
    }

    .body {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .tabs-container {
      width: 680px;
      height: 540px;
      padding: 24px 32px 32px;
      border-radius: 20px;
      background: color-mix(in srgb, var(--fg) 3%, transparent);
      border: 1px solid color-mix(in srgb, var(--fg) 10%, transparent);
      box-shadow: 0 20px 50px -25px color-mix(in srgb, var(--bg) 70%, transparent);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .data-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(20px, 2vw, 26px);
      font-weight: 500;
      line-height: 1.2;
      color: var(--fg);
    }
    .data-title em { font-style: italic; color: var(--accent); font-weight: 500; }

    .table-wrapper {
      width: 100%;
      max-width: 340px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 14px;
    }
    .data-table thead th {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: color-mix(in srgb, var(--fg) 60%, transparent);
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid color-mix(in srgb, var(--fg) 18%, transparent);
    }
    .data-table thead th.data-price-col {
      color: var(--accent);
      text-align: right;
    }
    .data-table thead .data-var-row th {
      font-family: 'STIX Two Math', 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0;
      text-transform: none;
      color: color-mix(in srgb, var(--fg) 70%, transparent);
      padding: 4px 10px 2px;
      border-bottom: none;
    }
    .data-table thead .data-var-row th.data-price-col {
      color: var(--accent);
      text-align: right;
    }
    .table-container {
      height: 350px;
      overflow-y: auto;
      border-radius: 4px;
      padding-right: 8px;
    }
    .table-container::-webkit-scrollbar { width: 6px; }
    .table-container::-webkit-scrollbar-track { background: transparent; }
    .table-container::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--fg) 20%, transparent); border-radius: 10px; }
    
    .tab-header {
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid color-mix(in srgb, var(--fg) 10%, transparent);
      padding-bottom: 14px;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: color-mix(in srgb, var(--fg) 50%, transparent);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 16px;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s ease;
    }
    .tab-btn:hover {
      color: var(--fg);
      background: color-mix(in srgb, var(--fg) 6%, transparent);
    }
    .tab-btn.active {
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 12%, transparent);
    }
    .tab-content {
      display: none;
      flex-direction: column;
      flex: 1;
    }
    .tab-content.active {
      display: flex;
    }
    
    .data-table tbody td {
      padding: 12px 10px;
      border-bottom: 1px solid color-mix(in srgb, var(--fg) 8%, transparent);
      color: color-mix(in srgb, var(--fg) 88%, transparent);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }
    .data-table tbody tr:last-child td { border-bottom: none; }
    .data-table tbody td.data-price-cell {
      text-align: right;
      font-weight: 700;
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13.5px;
    }
    .data-table tbody tr:hover td {
      background: color-mix(in srgb, var(--accent) 8%, transparent);
    }
    
    .download-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 8px;
      background: color-mix(in srgb, var(--accent) 15%, transparent);
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
      cursor: pointer;
      transition: all 0.2s ease;
      align-self: center;
    }
    .download-btn:hover {
      background: color-mix(in srgb, var(--accent) 25%, transparent);
      transform: translateY(-1px);
    }
    .download-btn svg {
      width: 14px;
      height: 14px;
    }
  </style>
  <link rel="stylesheet" href="../shared/page-title.css">
  <script defer src="../shared/page-title.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <page-title id="header" eyebrow="Machine Learning Models" title="Simple <em>Linear</em> Regression"></page-title>

  <div class="body">
    <div class="tabs-container">
      <div class="tab-header">
        <div class="data-title" style="margin-right: auto;">Ice Cream <em>Sales</em></div>
        <button class="tab-btn active" data-tab="tabTable" onclick="switchTab('tabTable')">Dataset Table</button>
        <button class="tab-btn" data-tab="tabPlot" onclick="switchTab('tabPlot')">Scatter Plot</button>
      </div>

      <!-- TAB: TABLE -->
      <div id="tabTable" class="tab-content active">
        <div class="table-wrapper">
          <div class="table-container">
            <table class="data-table" id="houseDataTable">
              <thead>
                <tr class="data-var-row">
                  <th>x</th>
                  <th class="data-price-col">y</th>
                </tr>
                <tr>
                  <th>Temperature (°C)</th>
                  <th class="data-price-col">Ice Creams Sold</th>
                </tr>
              </thead>
              <tbody>
                <tr><td>18.2</td><td class="data-price-cell">115</td></tr>
                <tr><td>18.6</td><td class="data-price-cell">141</td></tr>
                <tr><td>19.3</td><td class="data-price-cell">129</td></tr>
                <tr><td>21.7</td><td class="data-price-cell">193</td></tr>
                <tr><td>22.3</td><td class="data-price-cell">167</td></tr>
                <tr><td>22.8</td><td class="data-price-cell">217</td></tr>
                <tr><td>25.4</td><td class="data-price-cell">185</td></tr>
                <tr><td>25.9</td><td class="data-price-cell">233</td></tr>
                <tr><td>26.6</td><td class="data-price-cell">216</td></tr>
                <tr><td>27.2</td><td class="data-price-cell">261</td></tr>
                <tr><td>27.3</td><td class="data-price-cell">262</td></tr>
                <tr><td>27.7</td><td class="data-price-cell">228</td></tr>
                <tr><td>27.7</td><td class="data-price-cell">234</td></tr>
                <tr><td>28.2</td><td class="data-price-cell">225</td></tr>
                <tr><td>29.1</td><td class="data-price-cell">301</td></tr>
                <tr><td>29.7</td><td class="data-price-cell">270</td></tr>
                <tr><td>30.9</td><td class="data-price-cell">326</td></tr>
                <tr><td>32.5</td><td class="data-price-cell">348</td></tr>
                <tr><td>32.7</td><td class="data-price-cell">290</td></tr>
                <tr><td>33.8</td><td class="data-price-cell">289</td></tr>
                <tr><td>36.2</td><td class="data-price-cell">334</td></tr>
                <tr><td>36.6</td><td class="data-price-cell">357</td></tr>
                <tr><td>37</td><td class="data-price-cell">372</td></tr>
                <tr><td>37.7</td><td class="data-price-cell">339</td></tr>
                <tr><td>38.4</td><td class="data-price-cell">368</td></tr>
                <tr><td>39.6</td><td class="data-price-cell">385</td></tr>
                <tr><td>40.1</td><td class="data-price-cell">374</td></tr>
                <tr><td>40.7</td><td class="data-price-cell">411</td></tr>
                <tr><td>41.6</td><td class="data-price-cell">455</td></tr>
                <tr><td>41.7</td><td class="data-price-cell">423</td></tr>
              </tbody>
            </table>
          </div>
          <button class="download-btn" onclick="downloadCSV()">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Download CSV
          </button>
        </div>
      </div>

      <!-- TAB: PLOT -->
      <div id="tabPlot" class="tab-content">
        <div style="position: relative; flex: 1; min-height: 380px; width: 100%;">
          <canvas id="scatterChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-tab') === tabId);
      });
      document.querySelectorAll('.tab-content').forEach(content => {
        content.classList.toggle('active', content.id === tabId);
      });
      if (tabId === 'tabPlot' && scatterChart) {
        setTimeout(() => {
          scatterChart.resize();
          scatterChart.update();
        }, 50);
      }
    }

    // Theme alignment logic
    const PALETTE_SETS = {
      'Warm Linen':  { bg: '#f3f1e9', fg: '#1c1c1c', accent: '#e27b5e' },
      'Green Linen': { bg: '#f3f1e9', fg: '#1c1c1c', accent: '#2e8b57' },
      'Paper White': { bg: '#ffffff', fg: '#111111', accent: '#d0465a' },
      'Midnight':    { bg: '#000000', fg: '#f0ece4', accent: '#f59e0b' },
      'Navy Lime':   { bg: '#0a1428', fg: '#f1f5fb', accent: '#a3e635' },
    };

    function applyPalette(name) {
      const set = PALETTE_SETS[name] || PALETTE_SETS['Navy Lime'];
      const root = document.documentElement;
      root.style.setProperty('--bg', set.bg);
      root.style.setProperty('--fg', set.fg);
      root.style.setProperty('--accent', set.accent);
      setTimeout(updateChartColors, 50); // Small delay to let CSS variables apply
    }

    window.addEventListener('message', (e) => {
      const data = e.data || {};
      if (data.type !== 'SET_THEME') return;
      const name = data.palette || (data.mode === 'dark' ? 'Navy Lime' : 'Warm Linen');
      applyPalette(name);
    });

    // --- Chart.js Logic ---
    const rawData = [
      [18.2, 115], [18.6, 141], [19.3, 129], [21.7, 193], [22.3, 167],
      [22.8, 217], [25.4, 185], [25.9, 233], [26.6, 216], [27.2, 261],
      [27.3, 262], [27.7, 228], [27.7, 234], [28.2, 225], [29.1, 301],
      [29.7, 270], [30.9, 326], [32.5, 348], [32.7, 290], [33.8, 289],
      [36.2, 334], [36.6, 357], [37, 372], [37.7, 339], [38.4, 368],
      [39.6, 385], [40.1, 374], [40.7, 411], [41.6, 455], [41.7, 423]
    ];
    
    const chartData = rawData.map(p => ({ x: p[0], y: p[1] }));
    let scatterChart;

    function initChart() {
      const ctx = document.getElementById('scatterChart').getContext('2d');
      const rootStyles = getComputedStyle(document.documentElement);
      const fgColor = rootStyles.getPropertyValue('--fg').trim() || '#eef2f8';
      const accentColor = rootStyles.getPropertyValue('--accent').trim() || '#c97a4a';

      scatterChart = new Chart(ctx, {
        type: 'scatter',
        data: {
          datasets: [{
            label: 'Ice Cream Sales',
            data: chartData,
            backgroundColor: accentColor,
            borderColor: accentColor,
            pointRadius: 6,
            pointHoverRadius: 9,
            pointBackgroundColor: colorMix(accentColor, 'transparent', 0.2), // custom helper below
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: { duration: 1200, easing: 'easeOutQuart' },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: 'rgba(0,0,0,0.85)',
              titleFont: { family: 'Inter', size: 13 },
              bodyFont: { family: 'JetBrains Mono', size: 13 },
              padding: 12,
              displayColors: false,
              callbacks: {
                label: function(context) {
                  return `Temp: ${context.parsed.x}°C | Sales: ${context.parsed.y}`;
                }
              }
            }
          },
          scales: {
            x: {
              title: { display: true, text: 'Temperature (°C)', color: fgColor, font: { family: 'Inter', size: 15, weight: 600 } },
              ticks: { color: fgColor, font: { family: 'JetBrains Mono' } },
              grid: { color: 'rgba(128,128,128,0.15)' }
            },
            y: {
              title: { display: true, text: 'Ice Creams Sold', color: fgColor, font: { family: 'Inter', size: 15, weight: 600 } },
              ticks: { color: fgColor, font: { family: 'JetBrains Mono' } },
              grid: { color: 'rgba(128,128,128,0.15)' }
            }
          }
        }
      });
    }

    // Helper to simulate CSS color-mix for ChartJS
    function colorMix(hex, ignored, alpha) {
      if(hex.startsWith('#')) {
         const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
         return `rgba(${r},${g},${b},${1-alpha})`;
      }
      return hex;
    }

    function updateChartColors() {
      if (!scatterChart) return;
      const rootStyles = getComputedStyle(document.documentElement);
      const fgColor = rootStyles.getPropertyValue('--fg').trim();
      const accentColor = rootStyles.getPropertyValue('--accent').trim();

      scatterChart.data.datasets[0].backgroundColor = colorMix(accentColor, 'transparent', 0.2);
      scatterChart.data.datasets[0].borderColor = accentColor;
      scatterChart.options.scales.x.title.color = fgColor;
      scatterChart.options.scales.x.ticks.color = fgColor;
      scatterChart.options.scales.y.title.color = fgColor;
      scatterChart.options.scales.y.ticks.color = fgColor;
      scatterChart.options.scales.x.grid.color = colorMix(fgColor, 'transparent', 0.85);
      scatterChart.options.scales.y.grid.color = colorMix(fgColor, 'transparent', 0.85);
      scatterChart.update();
    }

    window.addEventListener('DOMContentLoaded', initChart);

    function downloadCSV() {
      const rows = [
        ["Temperature (°C)", "Ice Creams Sold"],
        [18.2, 115], [18.6, 141], [19.3, 129], [21.7, 193], [22.3, 167],
        [22.8, 217], [25.4, 185], [25.9, 233], [26.6, 216], [27.2, 261],
        [27.3, 262], [27.7, 228], [27.7, 234], [28.2, 225], [29.1, 301],
        [29.7, 270], [30.9, 326], [32.5, 348], [32.7, 290], [33.8, 289],
        [36.2, 334], [36.6, 357], [37, 372], [37.7, 339], [38.4, 368],
        [39.6, 385], [40.1, 374], [40.7, 411], [41.6, 455], [41.7, 423]
      ];
      let csvContent = "data:text/csv;charset=utf-8," 
          + rows.map(e => e.join(",")).join("\n");
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", "ice_cream_sales.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>

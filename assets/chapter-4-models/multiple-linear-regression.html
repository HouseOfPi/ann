<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiple Linear Regression | Presentation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=STIX+Two+Math&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #000000;
      --fg: #eef2f8;
      --accent: #c97a4a;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      padding: 32px 50px 36px;
      transition: background 0.5s, color 0.5s;
    }

    /* ── Dataset card ── */
    .dataset-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-radius: 20px;
      background: color-mix(in srgb, var(--fg) 3%, transparent);
      border: 1px solid color-mix(in srgb, var(--fg) 10%, transparent);
      overflow: hidden;
    }

    /* ── Card header ── */
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 28px 16px;
      border-bottom: 1px solid color-mix(in srgb, var(--fg) 8%, transparent);
      flex-shrink: 0;
    }
    .dataset-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: color-mix(in srgb, var(--fg) 55%, transparent);
    }
    .dataset-name span {
      color: var(--accent);
    }
    .col-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: color-mix(in srgb, var(--fg) 35%, transparent);
      background: color-mix(in srgb, var(--fg) 6%, transparent);
      border: 1px solid color-mix(in srgb, var(--fg) 10%, transparent);
      padding: 4px 12px;
      border-radius: 20px;
    }

    /* ── Table ── */
    .table-outer {
      position: relative;
      flex: 1;
      overflow: hidden;
    }
    .table-scroll {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .table-scroll::-webkit-scrollbar { display: none; }

    .scroll-fade {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 52px;
      background: linear-gradient(to top, color-mix(in srgb, var(--bg) 90%, transparent), transparent);
      pointer-events: none;
      z-index: 10;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }

    thead {
      position: sticky;
      top: 0;
      z-index: 5;
      background: color-mix(in srgb, var(--fg) 4%, var(--bg));
    }

    /* Column-name row */
    thead tr.row-name th {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: none;
      color: color-mix(in srgb, var(--fg) 65%, transparent);
      text-align: left;
      padding: 10px 16px 4px;
      white-space: nowrap;
      border-bottom: none;
    }
    thead tr.row-name th.col-y {
      color: var(--accent);
      font-weight: 800;
    }

    /* Divider row */
    thead tr.row-divider th {
      padding: 0 16px 8px;
      border-bottom: 1px solid color-mix(in srgb, var(--fg) 14%, transparent);
    }
    thead tr.row-divider th .divider-line {
      height: 2px;
      border-radius: 2px;
      background: color-mix(in srgb, var(--fg) 12%, transparent);
    }
    thead tr.row-divider th.col-y .divider-line {
      background: var(--accent);
      opacity: 0.5;
    }

    /* Body */
    tbody tr {
      border-bottom: 1px solid color-mix(in srgb, var(--fg) 6%, transparent);
      transition: background 0.12s ease;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }

    tbody td {
      padding: 10px 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      color: color-mix(in srgb, var(--fg) 82%, transparent);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      text-align: left;
    }

    tbody td.col-y {
      font-weight: 700;
      color: var(--accent);
      font-size: 13.5px;
    }

    /* Row index column */
    tbody td.row-idx {
      color: color-mix(in srgb, var(--fg) 25%, transparent);
      font-size: 11.5px;
      font-weight: 500;
      padding-right: 8px;
      padding-left: 20px;
      width: 32px;
    }
    thead tr.row-name th.row-idx { padding-left: 20px; padding-right: 8px; }
    thead tr.row-divider th.row-idx { padding-left: 20px; padding-right: 8px; }
  </style>
  <link rel="stylesheet" href="../shared/page-title.css">
  <script defer src="../shared/page-title.js"></script>
</head>
<body>
  <page-title id="header" eyebrow="Machine Learning Models" title="Multiple <em>Linear</em> Regression"></page-title>

  <div class="dataset-card">
    <div class="card-header">
      <span class="dataset-name">usa_housing_<span>kaggle</span></span>
      <span class="col-count">10 features · 1 target</span>
    </div>

    <div class="table-outer">
      <div class="table-scroll">
        <table>
          <thead>
            <tr class="row-name">
              <th class="row-idx"></th>
              <th class="col-y">Price</th>
              <th>Bedrooms</th>
              <th>Bathrooms</th>
              <th>SquareFeet</th>
              <th>YearBuilt</th>
              <th>GarageSpaces</th>
              <th>LotSize</th>
              <th>ZipCode</th>
              <th>CrimeRate</th>
              <th>SchoolRating</th>
            </tr>
            <tr class="row-divider">
              <th class="row-idx"><div class="divider-line"></div></th>
              <th class="col-y"><div class="divider-line"></div></th>
              <th><div class="divider-line"></div></th>
              <th><div class="divider-line"></div></th>
              <th><div class="divider-line"></div></th>
              <th><div class="divider-line"></div></th>
              <th><div class="divider-line"></div></th>
              <th><div class="divider-line"></div></th>
              <th><div class="divider-line"></div></th>
              <th><div class="divider-line"></div></th>
              <th><div class="divider-line"></div></th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="scroll-fade"></div>
    </div>
  </div>

  <script>
    const DATA = [
      [221958,  1, 1.9, 4827, 1979, 2, 1.45, 82240, 48.6,  5],
      [771155,  2, 2.0, 1035, 1987, 2, 1.75, 74315, 92.03, 9],
      [231932,  1, 3.0, 2769, 1982, 1, 1.46, 79249, 52.08, 3],
      [465838,  3, 3.3, 2708, 1907, 3, 1.62, 80587, 61.65, 1],
      [359178,  4, 3.4, 1175, 1994, 2, 0.74, 20756, 15.66, 4],
      [744167,  1, 3.4, 4330, 1920, 0, 1.65, 78011,  4.37, 9],
      [210268,  1, 1.3, 3435, 1980, 2, 0.25, 46378, 11.08, 4],
      [832180,  2, 2.5, 2370, 1986, 0, 1.80, 14255, 59.85, 2],
      [154886,  2, 1.2, 3360, 2000, 1, 1.14, 24484,  9.5,  5],
      [237337,  3, 2.6, 4191, 2017, 0, 1.65, 66549, 37.6,  3],
      [519412,  4, 2.1, 2654, 1995, 2, 1.38, 55123, 22.4,  7],
      [683900,  3, 3.5, 3812, 2003, 3, 2.10, 91045, 44.2,  8],
      [298441,  2, 1.5, 1890, 1973, 1, 0.92, 33217, 67.3,  2],
      [912375,  5, 4.0, 5120, 2010, 3, 2.55, 60812, 18.9, 10],
      [187623,  1, 1.0, 1240, 1965, 0, 0.48, 71430, 83.1,  1],
      [430550,  2, 2.2, 2200, 1998, 2, 1.20, 49876, 31.5,  6],
      [564880,  3, 2.8, 3100, 2005, 2, 1.75, 38924, 25.0,  7],
      [345220,  2, 1.8, 2410, 1990, 1, 1.05, 52341, 40.2,  4],
      [728640,  4, 3.2, 3950, 2008, 3, 2.30, 67810, 14.8,  9],
      [490100,  3, 2.5, 2780, 2001, 2, 1.55, 44629, 28.7,  6],
    ];

    const tbody = document.getElementById('tableBody');
    DATA.forEach((row, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="row-idx">${i}</td>
        <td class="col-y">${row[0].toLocaleString()}</td>
        <td>${row[1]}</td>
        <td>${row[2].toFixed(1)}</td>
        <td>${row[3].toLocaleString()}</td>
        <td>${row[4]}</td>
        <td>${row[5]}</td>
        <td>${row[6].toFixed(2)}</td>
        <td>${row[7].toLocaleString()}</td>
        <td>${row[8]}</td>
        <td>${row[9]}</td>
      `;
      tbody.appendChild(tr);
    });

    // Theme sync
    const PALETTE_SETS = {
      'Warm Linen':  { bg: '#f3f1e9', fg: '#1c1c1c', accent: '#b84c30' },
      'Green Linen': { bg: '#f3f1e9', fg: '#1c1c1c', accent: '#166534' },
      'Paper White': { bg: '#ffffff', fg: '#111111', accent: '#c23348' },
      'Midnight':    { bg: '#000000', fg: '#f0ece4', accent: '#f59e0b' },
      'Navy Lime':   { bg: '#0a1428', fg: '#f1f5fb', accent: '#a3e635' },
    };
    function applyPalette(name) {
      const set = PALETTE_SETS[name] || PALETTE_SETS['Navy Lime'];
      document.documentElement.style.setProperty('--bg', set.bg);
      document.documentElement.style.setProperty('--fg', set.fg);
      document.documentElement.style.setProperty('--accent', set.accent);
    }
    window.addEventListener('message', (e) => {
      const d = e.data || {};
      if (d.type !== 'SET_THEME') return;
      applyPalette(d.palette || (d.mode === 'dark' ? 'Navy Lime' : 'Warm Linen'));
    });
  </script>
</body>
</html>

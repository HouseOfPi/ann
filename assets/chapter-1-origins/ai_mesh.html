<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI · ML · DL · GenAI — The Tangled Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,700;1,400;1,500&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
  @keyframes nodeFire {
    0%   { transform: scale(1); filter: brightness(1); }
    15%  { transform: scale(1.45); filter: brightness(1.8); }
    40%, 100% { transform: scale(1); filter: brightness(1); }
  }
  .nn-node-anim {
    transform-origin: center;
    transform-box: fill-box;
  }
  #dl-processing-card:hover .nn-node-anim {
    animation: nodeFire 1.5s infinite linear;
  }
  :root {
    --bg-page: transparent;
    --mesh-line: #1c2438;
    --text-main: #e8ecf5;
    --text-dim: #94a3b8;
    --bubble-bg: #f3f1e9;
    --bubble-shadow: rgba(0, 0, 0, 0.08);
    --ai-color: #5b54c9;
    --ml-color: #6b9b7a;
    --dl-color: #c79a2e;
    --gen-color: #c0602a;
    --title-color: #1c1c1c;
    --subtitle-color: #6b6b6b;
  }
  [data-theme="paper-white"] {
    --mesh-line: #1a2238;
    --bubble-bg: #ffffff;
    --text-main: #0f172a;
    --text-dim: #475569;
    --title-color: #0a0a0a;
    --subtitle-color: #555555;
  }
  [data-theme="warm-linen"] {
    --mesh-line: #1f2a44;
    --bubble-bg: #faf7ee;
    --text-main: #1c1c1c;
    --text-dim: #6b6b6b;
    --title-color: #1c1c1c;
    --subtitle-color: #6b6b6b;
  }
  [data-theme="midnight"] {
    --mesh-line: #6b7aa8;
    --bubble-bg: #12172a;
    --text-main: #f1f5f9;
    --text-dim: #94a3b8;
    --ai-color: #8b82f0;
    --ml-color: #5cc389;
    --dl-color: #e8c14e;
    --gen-color: #f08659;
    --title-color: #f1f5f9;
    --subtitle-color: #94a3b8;
  }
  [data-theme="mint"] {
    --mesh-line: #0a3d2a;
    --bubble-bg: #eef7f1;
    --text-main: #0f2e1e;
    --text-dim: #065f46;
    --title-color: #0f2e1e;
    --subtitle-color: #065f46;
  }
  [data-theme="plum"] {
    --mesh-line: #3d1d4a;
    --bubble-bg: #f2e6f4;
    --text-main: #2b1a33;
    --text-dim: #6b4a78;
    --ai-color: #7a42a8;
    --ml-color: #8a6b3f;
    --dl-color: #c28430;
    --gen-color: #c44a6c;
    --title-color: #2b1a33;
    --subtitle-color: #6b4a78;
  }

  /* ── Big Picture Button ── */
  .big-picture-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: color-mix(in srgb, var(--bubble-bg) 70%, transparent);
    color: var(--title-color);
    border: 1px solid color-mix(in srgb, var(--title-color) 12%, transparent);
    border-radius: 40px;
    padding: 11px 26px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.4px;
    cursor: pointer;
    backdrop-filter: blur(12px) saturate(1.4);
    -webkit-backdrop-filter: blur(12px) saturate(1.4);
    box-shadow:
      0 2px 12px rgba(0,0,0,0.08),
      inset 0 1px 0 rgba(255,255,255,0.35);
    transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.22s, background 0.22s, border-color 0.22s;
    z-index: 10;
  }
  .big-picture-btn:hover {
    transform: translate(-50%, calc(-50% - 3px)) scale(1.04);
    background: color-mix(in srgb, var(--bubble-bg) 92%, transparent);
    border-color: color-mix(in srgb, var(--ai-color) 50%, transparent);
    box-shadow:
      0 8px 28px rgba(0,0,0,0.13),
      inset 0 1px 0 rgba(255,255,255,0.4);
  }

  /* ══════════════════════════════════════════
     BIG PICTURE MODAL — Themed Image
     ══════════════════════════════════════════ */
  .bp-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .bp-overlay.open { display: flex; }

  .bp-modal {
    background: transparent;
    padding: 0;
    max-width: 96vw;
    max-height: 96vh;
    width: auto;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bp-image {
    display: block;
    max-width: 96vw;
    max-height: 96vh;
    width: auto;
    height: auto;
    border-radius: 18px;
    box-shadow: 0 30px 90px rgba(0,0,0,0.7);
  }

  .bp-close {
    position: absolute;
    top: -14px; right: -14px;
    background: rgba(255,255,255,0.95);
    border: none;
    width: 38px; height: 38px;
    border-radius: 50%;
    font-size: 22px;
    cursor: pointer;
    color: #0f172a;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    transition: transform 0.2s;
    z-index: 5;
  }
  .bp-close:hover { transform: scale(1.08); }

  /* Neural Network Graphic — preserve animated SVG (kept for compat) */
  .nn-node { fill: var(--bp-nn); opacity: 0.85; filter: drop-shadow(0 0 3px color-mix(in srgb, var(--bp-nn) 50%, transparent)); }
  .nn-edge { stroke: var(--bp-nn); stroke-width: 0.6; stroke-opacity: 0.3; }
  .nn-signal { fill: #fff; filter: drop-shadow(0 0 5px var(--bp-nn)); pointer-events: none; }
  .nn-node.fire { filter: drop-shadow(0 0 8px #fff); transform: scale(1.3); transform-origin: center; transition: transform 0.2s; }

  /* ── Detail Modals ── */
  .detail-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .detail-overlay.open { display: flex; }
  .detail-modal {
    --modal-accent: var(--text-dim);
    background: linear-gradient(135deg, var(--bubble-bg) 0%, color-mix(in srgb, var(--bubble-bg), #000 2%) 100%);
    border-radius: 28px;
    padding: 28px 36px 24px;
    max-width: min(1100px, 96vw);
    width: fit-content;
    min-width: 760px;
    height: auto;
    max-height: 92vh;
    overflow: hidden;
    position: relative;
    box-shadow: 0 40px 100px rgba(0,0,0,0.4), inset 0 0 0 1.5px color-mix(in srgb, var(--modal-accent) 30%, transparent);
    border: none;
    display: flex;
    flex-direction: column;
    transform: scale(0.9);
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .detail-modal::before {
    content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
    background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--modal-accent) 4%, transparent) 0%, transparent 50%);
    pointer-events: none; opacity: 0.7;
  }
  .detail-overlay.open .detail-modal {
    transform: scale(1);
    opacity: 1;
  }
  .detail-close {
    position: absolute;
    top: 20px; right: 24px;
    background: rgba(128,128,128,0.1);
    border: none;
    width: 36px; height: 36px;
    border-radius: 50%;
    font-size: 20px; cursor: pointer;
    color: var(--text-dim);
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, color 0.2s;
  }
  .detail-close:hover { background: rgba(128,128,128,0.2); color: var(--title-color); }
  .detail-type-badge {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 20px;
  }
  .type-ai  { background: color-mix(in srgb, var(--ai-color) 20%, transparent); color: var(--ai-color); }
  .type-ml  { background: color-mix(in srgb, var(--ml-color) 20%, transparent); color: var(--ml-color); }
  .type-dl  { background: color-mix(in srgb, var(--dl-color) 20%, transparent); color: var(--dl-color); }
  .type-gen { background: color-mix(in srgb, var(--gen-color) 20%, transparent); color: var(--gen-color); }
  .detail-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 32px;
    font-weight: 700;
    color: var(--title-color);
    margin-bottom: 16px;
  }
  .detail-content {
    color: var(--text-dim);
    line-height: 1.6;
    font-size: 16px;
    min-height: auto;
  }
  .detail-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 120px;
    border: 2px dashed color-mix(in srgb, var(--text-dim) 20%, transparent);
    border-radius: 16px;
    opacity: 0.5;
  }
  .detail-placeholder-text { font-size: 14px; font-weight: 500; font-style: italic; }

  /* ── ML Modal Content Styles (Premium Redesign) ── */
  .ml-layout { 
    display: flex; flex-direction: column; gap: 20px; 
    color: var(--text-main); font-family: 'Exo 2', sans-serif; 
  }
  .ml-header { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 5px; }
  .ml-step-badge {
    width: 44px; height: 44px; background: var(--ml-color); color: #fff;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; font-size: 24px; font-weight: 800; flex-shrink: 0;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
  }
  .ml-title-area { display: flex; flex-direction: row; align-items: baseline; gap: 12px; }
  .ml-main-title { 
    font-size: 32px; font-weight: 800; 
    background: linear-gradient(to right, var(--ml-color), color-mix(in srgb, var(--ml-color), #000 20%));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: -1px; line-height: 1.1; 
  }
  .ml-sub-title { font-size: 24px; font-weight: 700; color: var(--ml-color); opacity: 0.6; margin-left: 2px; }
  .ml-example-text { font-size: 16px; color: var(--text-dim); margin-top: 6px; font-weight: 500; opacity: 0.8; }
  
  .ml-top-pill {
    background: color-mix(in srgb, var(--ml-color) 10%, var(--bubble-bg)); color: var(--ml-color); padding: 8px 24px;
    border-radius: 100px; font-size: 14px; font-weight: 700;
    align-self: center; margin: 5px 0 15px 0;
    border: 1px solid color-mix(in srgb, var(--ml-color) 20%, transparent);
  }

  .ml-flow-container {
    display: flex; align-items: center; justify-content: center;
    gap: 30px; margin-bottom: 15px; padding: 0 5px;
  }

  /* Left: Features */
  .ml-features-wrap { display: flex; align-items: center; gap: 8px; }
  .ml-feature-stack {
    display: flex; flex-direction: column; border: 1px solid #e0e0e0;
    border-radius: 12px; overflow: hidden; background: #fff; width: 230px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.03);
  }
  .ml-feature-item {
    display: flex; align-items: center; gap: 14px; padding: 12px 16px;
    border-bottom: 1px solid #f0f0f0; font-size: 13px; font-weight: 600; color: #333;
  }
  .ml-feature-item:last-child { border-bottom: none; }
  .ml-feature-svg { width: 22px; height: 22px; flex-shrink: 0; opacity: 0.8; }
  
  .ml-bracket-svg { width: 25px; height: 180px; }

  /* Premium Effects */
  .ml-card-lift:hover { transform: translateY(-8px) scale(1.02); }
  @keyframes ml-pulse {
    0% { filter: drop-shadow(0 0 5px color-mix(in srgb, var(--ml-color) 30%, transparent)); }
    50% { filter: drop-shadow(0 0 15px color-mix(in srgb, var(--ml-color) 60%, transparent)); }
    100% { filter: drop-shadow(0 0 5px color-mix(in srgb, var(--ml-color) 30%, transparent)); }
  }
  .ml-model-pulse { animation: ml-pulse 3s infinite ease-in-out; }
  
  /* Car flow sequential reveal */
  .car-flow-step { opacity: 0; }
  .car-flow-arrow-step { opacity: 0; }

  .def-pillar-card {
    cursor: default;
    transition: border-color 0.3s ease;
  }
  .def-pillar-card.revealed {
    cursor: default;
  }

  /* Centered Hover Reveals */
  .model-section-wrap { position: relative; width: 100%; display: flex; flex-direction: column; align-items: center; }

  .training-preview {
    position: absolute; top: 46%; left: 50%; width: 480px; height: auto;
    background: var(--bubble-bg); border-radius: 22px;
    opacity: 0; pointer-events: none;
    transform: translate(-50%, -50%) scale(0.85);
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 9999; display: flex; flex-direction: column; padding: 26px 31px;
    box-shadow: 0 40px 80px rgba(0,0,0,0.5); border: 2.5px solid var(--ml-color);
    isolation: isolate;
    font-size: 13px;
  }
  .training-preview .training-table { font-size: 13px !important; }

  .model-section-wrap:hover .training-preview {
    opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto;
  }

  /* Hide flow arrows when popup is open */
  .ml-flow-arrow { transition: opacity 0.25s ease; }
  .ml-flow-container:has(.model-section-wrap:hover) .ml-flow-arrow {
    opacity: 0 !important;
  }

  /* Lift brain card above siblings so popup renders on top */
  .ml-flow-container > .ml-card-lift { transition: z-index 0s; }
  .ml-flow-container:has(.model-section-wrap:hover) > .ml-card-lift:nth-child(3) {
    z-index: 9999;
  }
  @supports not selector(:has(*)) {
    .ml-flow-container:hover .ml-flow-arrow { opacity: 0; }
  }

  .training-table { width: 100%; border-collapse: collapse; font-size: 10px; color: var(--text-dim); table-layout: fixed; }
  .training-table th { text-align: left; padding: 4px; border-bottom: 1px solid rgba(128,128,128,0.2); color: var(--ml-color); font-weight: 800; text-transform: uppercase; }
  .training-table td { padding: 4px; border-bottom: 1px solid rgba(128,128,128,0.1); font-weight: 600; }
  /* Visual gap between features (cols 1-5) and target (col 6) */
  .training-table th:last-child,
  .training-table td:last-child { padding-left: 14px; }

  /* Features / Target highlight overlay -- pops in sequentially on hover */
  .features-box, .target-box {
    position: absolute; top: -2px; bottom: -2px;
    border-radius: 6px;
    pointer-events: none;
    opacity: 0;
    transform: scale(0.94);
    will-change: transform, opacity;
    box-sizing: border-box;
  }
  .features-box {
    left: -3px; width: calc(100% * 5 / 6 - 5px);
    border: 2px dashed color-mix(in srgb, var(--ml-color) 80%, transparent);
    background: color-mix(in srgb, var(--ml-color) 8%, transparent);
  }
  .target-box {
    right: -3px; width: calc(100% * 1 / 6 - 2px);
    border: 2px solid var(--ml-color);
    background: color-mix(in srgb, var(--ml-color) 18%, transparent);
    box-shadow: 0 0 0 0 color-mix(in srgb, var(--ml-color) 50%, transparent);
  }
  .box-label {
    position: absolute; top: -16px; left: 50%; transform: translateX(-50%);
    font-size: 8px; font-weight: 900; letter-spacing: 1.2px;
    color: var(--ml-color); white-space: nowrap;
    background: var(--bubble-bg); padding: 1px 6px; border-radius: 4px;
  }
  @keyframes featuresPop {
    0%   { opacity: 0; transform: scale(0.94); }
    60%  { opacity: 1; transform: scale(1.02); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes targetPop {
    0%   { opacity: 0; transform: scale(0.9); box-shadow: 0 0 0 0 color-mix(in srgb, var(--ml-color) 50%, transparent); }
    60%  { opacity: 1; transform: scale(1.05); box-shadow: 0 0 0 6px color-mix(in srgb, var(--ml-color) 0%, transparent); }
    100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 color-mix(in srgb, var(--ml-color) 0%, transparent); }
  }
  .model-section-wrap:hover .features-box {
    animation: featuresPop 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards;
  }
  .model-section-wrap:hover .target-box {
    animation: targetPop 0.8s cubic-bezier(0.22, 1, 0.36, 1) 1.6s forwards;
  }

  /* Tab System */
  .ml-tabs {
    display: flex; gap: 4px; margin-bottom: 25px;
    background: rgba(128,128,128,0.08); padding: 5px; border-radius: 14px;
    width: fit-content; margin-left: auto; margin-right: auto;
  }
  .ml-tab-btn {
    padding: 10px 24px; border-radius: 10px; cursor: pointer;
    font-size: 13px; font-weight: 800; color: var(--text-dim);
    transition: all 0.3s ease; border: none; background: transparent;
    letter-spacing: 0.5px; text-transform: uppercase;
  }
  .ml-tab-btn.active {
    background: var(--ml-color); color: white;
    box-shadow: 0 4px 15px color-mix(in srgb, var(--ml-color) 40%, transparent);
  }
  .ml-tab-pane { display: none; width: 100%; flex-direction: column; align-items: center; min-height: 480px; justify-content: center; }
  .ml-tab-pane.active { display: flex; animation: fadeInModal 0.4s ease forwards; }

  .ml-model-sub { font-size: 11px; font-weight: 700; color: #666; }
  .ml-arrow-svg { width: 24px; height: 24px; opacity: 0.6; }

  /* Right: Output */
  .ml-output-card {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    background: #f1f8e9; border: 2px solid #c8e6c9; padding: 25px 25px;
    border-radius: 24px; width: 200px; text-align: center; flex-shrink: 0;
  }
  .ml-output-label { font-size: 12px; font-weight: 800; color: #2e7d32; text-transform: uppercase; letter-spacing: 1px; }
  .ml-output-title { font-size: 16px; font-weight: 700; color: #333; margin-top: 5px; }
  .ml-output-value { font-size: 26px; font-weight: 900; color: #2e7d32; margin-top: 4px; }

  /* Footer Boxes (Side-by-side) */
  .ml-footer { display: flex; gap: 15px; margin-top: 5px; }
  .ml-info-box {
    background: #f5fcf5; border-radius: 20px; padding: 15px 20px;
    display: flex; align-items: center; gap: 15px; border: 1px solid #e0f2f1;
    flex: 1;
  }
  .ml-info-plot-svg { width: 60px; height: 40px; flex-shrink: 0; }
  .ml-info-text { font-size: 13px; color: #2e7d32; font-weight: 600; line-height: 1.5; }
  
  .ml-key-idea-box {
    background: #edf7ed; border-radius: 20px; padding: 15px 20px;
    display: flex; align-items: center; gap: 15px; border: 1px solid #c8e6c9;
    flex: 1;
  }
  .ml-ki-icon-svg { width: 34px; height: 34px; flex-shrink: 0; }
  .ml-ki-text { font-size: 16px; color: #1b5e20; font-weight: 600; }
  .ml-ki-text strong { color: #2e7d32; font-weight: 800; font-size: 17px; }

  .ml-dots { font-size: 24px; color: #ccc; margin-left: 105px; line-height: 1; letter-spacing: 4px; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg-page);
    color: var(--text-main);
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-start;
    padding: 5vh 7vw 20px;
  }

  .header {
    position: absolute;
    top: 32px;
    left: 0;
    right: 0;
    text-align: center;
    opacity: 0;
  }
  .header-eyebrow {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--c1, var(--subtitle-color));
    margin-bottom: 14px;
  }
  .header-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(28px, 3.6vw, 44px);
    font-weight: 600;
    color: var(--title-color);
    letter-spacing: -0.5px;
  }
  .header-title em {
    font-style: italic;
    color: var(--gen-color);
  }
  .header-sub {
    margin-top: 8px;
    font-size: 14px;
    color: var(--subtitle-color);
    letter-spacing: 0.5px;
  }

  .footer-note {
    display: none;
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--subtitle-color);
    opacity: 0;
  }

  .canvas-wrap {
    position: relative;
    width: min(820px, 70vw);
    height: min(500px, 62vh);
    margin: 100px auto 0;
  }

  svg.mesh {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .scribble {
    fill: none;
    stroke: var(--mesh-line);
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.9;
  }
  [data-theme="midnight"] .scribble { opacity: 0.8; }

  .bubble-group { cursor: pointer; will-change: transform; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }

<script>
  // ─── SCRIBBLE GENERATION ──────────────────────────────────────────────
  const svgNS = 'http://www.w3.org/2000/svg';
  const scribbleG = document.getElementById('scribbles');
  const bubbleG   = document.getElementById('bubbles');

  const W = 1200, H = 720;
  const CX = W / 2, CY = H / 2;

  // Seeded PRNG for reproducible tangles
  function mulberry32(seed) {
    return function() {
      let t = seed += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rand = mulberry32(9271);

  // Build tangled sinuous paths constrained to a circular region
  function buildScribble(numSegments, bounds) {
    const pts = [];
    const ccx = bounds.cx;
    const ccy = bounds.cy;
    const radius = bounds.r;
    // Start at a random point inside the circle
    const startR = rand() * radius * 0.9;
    const startA = rand() * Math.PI * 2;
    let x = ccx + Math.cos(startA) * startR;
    let y = ccy + Math.sin(startA) * startR;
    let angle = rand() * Math.PI * 2;
    pts.push([x, y]);
    for (let i = 0; i < numSegments; i++) {
      const step = 40 + rand() * 90;
      angle += (rand() - 0.5) * 1.8;
      x += Math.cos(angle) * step;
      y += Math.sin(angle) * step;
      // Soft reflect off the circle boundary
      const dx = x - ccx;
      const dy = y - ccy;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > radius) {
        const overshoot = dist - radius;
        const nx = dx / dist;
        const ny = dy / dist;
        x -= nx * overshoot * 1.5;
        y -= ny * overshoot * 1.5;
        // Reflect angle across the inward normal
        const normalAngle = Math.atan2(-ny, -nx);
        angle = 2 * normalAngle - angle + Math.PI;
      }
      pts.push([x, y]);
    }
    // Convert to smooth cubic path
    let d = `M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
    for (let i = 1; i < pts.length - 1; i++) {
      const [x1, y1] = pts[i];
      const [x2, y2] = pts[i + 1];
      const cx = (x1 + x2) / 2;
      const cy = (y1 + y2) / 2;
      d += ` Q ${x1.toFixed(1)} ${y1.toFixed(1)} ${cx.toFixed(1)} ${cy.toFixed(1)}`;
    }
    return d;
  }

  const bounds = { cx: W / 2, cy: H / 2, r: Math.min(W, H) * 0.65 };

  // Circular clip path so mesh has hard sphere edges
  const defs = document.createElementNS(svgNS, 'defs');
  const clipPath = document.createElementNS(svgNS, 'clipPath');
  clipPath.setAttribute('id', 'meshClip');
  const clipCircle = document.createElementNS(svgNS, 'circle');
  clipCircle.setAttribute('cx', bounds.cx);
  clipCircle.setAttribute('cy', bounds.cy);
  clipCircle.setAttribute('r', bounds.r);
  clipPath.appendChild(clipCircle);
  defs.appendChild(clipPath);
  document.querySelector('svg.mesh').prepend(defs);
  scribbleG.setAttribute('clip-path', 'url(#meshClip)');

  const paths = [];
  const SCRIBBLE_COUNT = 28;
  for (let i = 0; i < SCRIBBLE_COUNT; i++) {
    const segCount = 32 + Math.floor(rand() * 20);
    const d = buildScribble(segCount, bounds);
    const p = document.createElementNS(svgNS, 'path');
    p.setAttribute('d', d);
    p.setAttribute('class', 'scribble');
    scribbleG.appendChild(p);
    paths.push(p);
  }

  // ─── SPEECH BUBBLES ──────────────────────────────────────────────────
  // Rectangular rounded callouts with a tail triangle pointing inward.
  // config: [cls, label, subLabel, x, y, w, h, tailX, tailY, tailSide]
  // tailSide: 'bottom'|'top'|'left'|'right'  (which side the tail protrudes from)
  const bubbles = [
    { cls: 'ai',  label: 'AI',    sub: 'Artificial Intelligence',  x: 167, y: 90,  w: 288, h: 150, tailX: 380, tailY: 240, side: 'bottom' },
    { cls: 'ml',  label: 'ML',    sub: 'Machine Learning',         x: 668, y: 140, w: 325, h: 150, tailX: 720, tailY: 290, side: 'bottom' },
    { cls: 'dl',  label: 'NN',    sub: 'Neural Network',           x: 120, y: 405, w: 300, h: 150, tailX: 360, tailY: 405, side: 'top' },
    { cls: 'gen', label: 'GenAI', sub: 'Generative AI',            x: 610, y: 444, w: 400, h: 162, tailX: 700, tailY: 444, side: 'top' },
  ];

  function tailPath(x, y, w, h, tx, ty, side) {
    // Bubble rect with rounded corners r, plus a tail triangle off the given side
    const r = 14;
    let d = `M ${x + r} ${y}`;
    // TOP edge
    if (side === 'top') {
      const baseMid = x + w * 0.25;
      d += ` L ${baseMid - 14} ${y}`;
      d += ` L ${tx} ${ty}`;
      d += ` L ${baseMid + 24} ${y}`;
    }
    d += ` L ${x + w - r} ${y}`;
    d += ` Q ${x + w} ${y} ${x + w} ${y + r}`;
    // RIGHT edge
    if (side === 'right') {
      const baseMid = y + h * 0.5;
      d += ` L ${x + w} ${baseMid - 14}`;
      d += ` L ${tx} ${ty}`;
      d += ` L ${x + w} ${baseMid + 24}`;
    }
    d += ` L ${x + w} ${y + h - r}`;
    d += ` Q ${x + w} ${y + h} ${x + w - r} ${y + h}`;
    // BOTTOM edge
    if (side === 'bottom') {
      const baseMid = x + w * 0.75;
      d += ` L ${baseMid + 14} ${y + h}`;
      d += ` L ${tx} ${ty}`;
      d += ` L ${baseMid - 24} ${y + h}`;
    }
    d += ` L ${x + r} ${y + h}`;
    d += ` Q ${x} ${y + h} ${x} ${y + h - r}`;
    // LEFT edge
    if (side === 'left') {
      const baseMid = y + h * 0.5;
      d += ` L ${x} ${baseMid + 14}`;
      d += ` L ${tx} ${ty}`;
      d += ` L ${x} ${baseMid - 24}`;
    }
    d += ` L ${x} ${y + r}`;
    d += ` Q ${x} ${y} ${x + r} ${y}`;
    d += ' Z';
    return d;
  }

  bubbles.forEach((b, i) => {
    const g = document.createElementNS(svgNS, 'g');
    g.setAttribute('class', `bubble-group ${b.cls}`);
    g.setAttribute('data-index', i);

    const path = document.createElementNS(svgNS, 'path');
    path.setAttribute('d', tailPath(b.x, b.y, b.w, b.h, b.tailX, b.tailY, b.side));
    path.setAttribute('class', 'bubble-box');
    g.appendChild(path);

    const sub = document.createElementNS(svgNS, 'text');
    sub.setAttribute('class', 'bubble-sub');
    sub.setAttribute('x', b.x + b.w / 2);
    sub.setAttribute('y', b.y + 32);
    sub.textContent = b.sub;
    g.appendChild(sub);

    const label = document.createElementNS(svgNS, 'text');
    label.setAttribute('class', 'bubble-text');
    label.setAttribute('x', b.x + b.w / 2);
    label.setAttribute('y', b.y + b.h / 2 + 18);
    label.setAttribute('font-size', b.label.length > 3 ? 64 : 80);
    label.textContent = b.label;
    g.appendChild(label);

    // pivot for scale-in
    const pivotX = b.x + b.w / 2;
    const pivotY = b.y + b.h / 2;
    g.style.transformOrigin = `${pivotX}px ${pivotY}px`;
    g.style.transformBox = 'fill-box';
    g.setAttribute('opacity', 0);
    g.style.cursor = 'pointer';
    g.onclick = () => openDetailModal(b.cls);

    bubbleG.appendChild(g);
  });

  // ─── ANIMATION ───────────────────────────────────────────────────────
  function animate() {
    // Prep paths for draw-in
    paths.forEach(p => {
      const len = p.getTotalLength();
      p.style.strokeDasharray = len;
      p.style.strokeDashoffset = len;
      p.style.opacity = 0.55;
    });

    // Reset bubbles
    gsap.set('.bubble-group', { opacity: 0, scale: 0.4 });
    gsap.set('.header', { opacity: 0, y: -10 });
    gsap.set('.footer-note', { opacity: 0 });
    gsap.set('.big-picture-btn', { opacity: 0, scale: 0.8, pointerEvents: 'none' });

    const tl = gsap.timeline();

    tl.to('.header', { opacity: 1, y: 0, duration: 0.8, ease: 'power2.out' }, 0);

    // Scribbles draw in a tangled rush (faster)
    tl.to(paths, {
      strokeDashoffset: 0,
      duration: 1.6,
      ease: 'power1.inOut',
      stagger: { each: 0.06, from: 'random' },
    }, 0.3);

    // Bubbles pop in ALONGSIDE the mesh drawing
    tl.to('.bubble-group', {
      opacity: 1,
      scale: 1,
      duration: 0.8,
      ease: 'back.out(1.8)',
      stagger: 0.15,
    }, 0.4);

    // Big Picture button pops in earlier as mesh completes
    tl.to('.big-picture-btn', {
      opacity: 1, 
      scale: 1, 
      pointerEvents: 'auto',
      duration: 0.5, 
      ease: 'back.out(2)'
    }, 2.2);

    tl.to('.footer-note', { opacity: 1, duration: 0.6 }, '-=0.3');
  }

  animate();

  // Replay on R
  document.addEventListener('keydown', (e) => {
    if (e.key === 'r' || e.key === 'R') { gsap.killTweensOf('*'); animate(); }
  });

  // Forward arrow-key navigation to the parent deck when this iframe has focus.
  document.addEventListener('keydown', (e) => {
    if (window.parent === window) return;
    const tag = (e.target && e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || (e.target && e.target.isContentEditable)) return;
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(e.key)) {
      e.preventDefault();
      window.parent.postMessage({ type: 'NAV', dir: 'next' }, '*');
    } else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) {
      e.preventDefault();
      window.parent.postMessage({ type: 'NAV', dir: 'prev' }, '*');
    }
  });

  window.addEventListener('message', (e) => {
    if (!e.data) return;
    if (e.data.type === 'SET_THEME') {

      const key = palette.toLowerCase().replace(/\s+/g, '-');
      document.body.setAttribute('data-theme', key);
    }
    if (e.data.type === 'RESTART_ANIMATION') {
      gsap.killTweensOf('*');
      animate();

  /* The midnight palette is the only "dark" theme; everything else uses light. */

  function applyDLImage(variant, mode) {
    const imgEl = document.getElementById('dl-input-img');
    const labelEl = document.getElementById('dl-output-label');
    const placeholderEl = document.getElementById('dl-output-placeholder');
    const hintEl = document.getElementById('dl-predict-hint');
    if (!imgEl || !labelEl) return;
    const fontSize = (mode === 'digits') ? '72px' : '28px';

    gsap.to(imgEl, { opacity: 0, scale: 0.95, duration: 0.2, onComplete: () => {
      imgEl.src = variant.img;
      gsap.to(imgEl, { opacity: 1, scale: 1, duration: 0.4, ease: 'power2.out' });
    }});

    // After the first prediction has been triggered, immediately update the label
    // (no placeholder flow). The placeholder/hint only show on the very first load.
    if (window.dlFirstPredictionDone) {
      labelEl.innerText = variant.label;
      labelEl.style.fontSize = fittedFontSize(variant.label, mode);
      gsap.fromTo(labelEl, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(2)' });
    } else {
      // First load: stash the label, show "?" placeholder + hint, wait for click.
      window.dlPendingLabel = variant.label;
      window.dlPendingFontSize = fittedFontSize(variant.label, mode);
      gsap.to(labelEl, { opacity: 0, duration: 0.2 });
      if (placeholderEl) gsap.to(placeholderEl, { opacity: 0.35, duration: 0.2 });
      if (hintEl) gsap.to(hintEl, { opacity: 0.85, duration: 0.2 });
    }
  }

  // Pick a label font size that fits the 150px-wide card without clipping.
  function fittedFontSize(text, mode) {
    if (mode === 'digits') return '72px';
    const len = (text || '').length;
    if (len <= 4)  return '34px';
    if (len <= 6)  return '28px';
    if (len <= 9)  return '22px';
    if (len <= 12) return '18px';
    return '16px';
  }

  function runDLPrediction() {
    const labelEl = document.getElementById('dl-output-label');
    const placeholderEl = document.getElementById('dl-output-placeholder');
    const hintEl = document.getElementById('dl-predict-hint');
    if (!labelEl) return;
    // Brief "thinking" pulse on the processing card, then reveal the label.
    const card = document.getElementById('dl-processing-card');
    if (card) {
      gsap.fromTo(card, { scale: 1 }, { scale: 1.05, duration: 0.15, yoyo: true, repeat: 1, ease: 'power2.inOut' });
    }
    if (hintEl) gsap.to(hintEl, { opacity: 0, duration: 0.2 });
    if (placeholderEl) gsap.to(placeholderEl, { opacity: 0, duration: 0.2 });
    setTimeout(() => {
      labelEl.innerText = window.dlPendingLabel || labelEl.innerText;
      labelEl.style.fontSize = window.dlPendingFontSize || labelEl.style.fontSize;
      gsap.fromTo(labelEl, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(2)' });
      window.dlFirstPredictionDone = true;
    }, 320);
  }

  function randomizeDLInput() {
    const mode = window.dlMode || 'digits';
    const labels = Object.keys(dlDatasets[mode]);
    if (!labels.length) return;

    let state = window.dlState[mode];
    if (!state) {
      const initialLabel = labels[0];

    }
    const variants = dlDatasets[mode][state.label];
    if (variants.length > 1) {
      let next = state.variantIdx;
      while (next === state.variantIdx) {
        next = Math.floor(Math.random() * variants.length);
      }
      state.variantIdx = next;
    }
    applyDLImage(variants[state.variantIdx], mode);
  }

  // Cancels any in-flight typewriter so re-typing on the same element doesn't race.
  window.genaiTypers = window.genaiTypers || {};

  // Type plain text one character at a time.
  function typewriteText(el, text, opts = {}) {
    if (!el) return;
    const speed = opts.speed || 18;       // ms per char
    const startDelay = opts.startDelay || 0;
    if (window.genaiTypers[el.id]) clearInterval(window.genaiTypers[el.id]);
    el.textContent = '';
    el.style.opacity = '1';
    setTimeout(() => {
      let i = 0;
      window.genaiTypers[el.id] = setInterval(() => {
        i++;
        el.textContent = text.slice(0, i);
        if (i >= text.length) {
          clearInterval(window.genaiTypers[el.id]);
          delete window.genaiTypers[el.id];
        }
      }, speed);
    }, startDelay);
  }

  // Type HTML one VISIBLE character at a time, leaving inline tags intact
  // so styling (e.g. <strong>, <em>, <span style="...">) appears as the text grows.
  function typewriteHTML(el, html, opts = {}) {
    if (!el) return;
    const speed = opts.speed || 14;
    const startDelay = opts.startDelay || 0;
    if (window.genaiTypers[el.id]) clearInterval(window.genaiTypers[el.id]);
    el.innerHTML = '';
    el.style.opacity = '1';

    // Tokenise into either an opening tag, a closing tag, or a single character.
    const tokens = [];
    let i = 0;
    while (i < html.length) {
      if (html[i] === '<') {
        const end = html.indexOf('>', i);
        if (end === -1) { tokens.push(html[i]); i++; }
        else { tokens.push(html.slice(i, end + 1)); i = end + 1; }
      } else {
        tokens.push(html[i]);
        i++;
      }
    }

    setTimeout(() => {
      let built = '';
      let openTags = []; // stack so we can keep the rendered HTML well-formed
      let k = 0;
      window.genaiTypers[el.id] = setInterval(() => {
        // Append one visible character (skip over any tags we hit in the process).
        let appended = false;
        while (k < tokens.length && !appended) {
          const t = tokens[k];
          if (t.startsWith('<')) {
            built += t;
            if (t.startsWith('</')) openTags.pop();
            else if (!t.endsWith('/>')) {
              const tagName = t.slice(1).split(/[\s>]/)[0];
              if (!['br','img','hr','input','meta','link'].includes(tagName)) {
                openTags.push(tagName);
              }
            }
            k++;
          } else {
            built += t;
            k++;
            appended = true;
          }
        }
        // Close any currently-open tags so the partial HTML stays valid.
        const closers = openTags.slice().reverse().map(tag => `</${tag}>`).join('');
        el.innerHTML = built + closers;
        if (k >= tokens.length) {
          clearInterval(window.genaiTypers[el.id]);
          delete window.genaiTypers[el.id];
          el.innerHTML = html; // settle to the final canonical HTML
        }
      }, speed);
    }, startDelay);
  }

  };
  const allFlowIds = [
    'def-step-card1','def-step-card2','def-step-card3','def-step-insight',
    'house-step-listing','house-step-arrow1','house-step-model','house-step-arrow2','house-step-output',
    'car-step-listing','car-step-arrow1','car-step-model','car-step-arrow2','car-step-output',
  ];
  let activeFlowTab = 0;
  let flowIndex = 0;

  function runFlowAnimation(tabIndex) {
    activeFlowTab = tabIndex;
    allFlowIds.forEach(id => {
      const el = document.getElementById(id);
      if (el) gsap.set(el, { opacity: 0, y: 0, scale: 1, scaleX: 1, clearProps: 'boxShadow' });
    });
    flowIndex = 0;
    advanceFlow();
  }

  function attachCardHover(el) {
    el.addEventListener('mouseenter', () => {
      gsap.to(el, { y: -7, scale: 1.03, duration: 0.45, ease: 'power3.out',
                    boxShadow: '0 16px 40px rgba(107,155,122,0.18)' });
    });
    el.addEventListener('mouseleave', () => {
      gsap.to(el, { y: 0, scale: 1, duration: 0.55, ease: 'elastic.out(1, 0.5)',
                    boxShadow: '0 0 0 0px rgba(107,155,122,0)' });
    });
  }

  function revealElement(el, delay, isArrow) {
    if (isArrow) {
      gsap.fromTo(el,
        { opacity: 0, scaleX: 0, transformOrigin: 'left center' },
        { opacity: 0.7, scaleX: 1, duration: 1.1, delay,
          ease: 'elastic.out(1, 0.55)' }
      );
    } else {
      gsap.fromTo(el,
        { opacity: 0, y: 36, scale: 0.9 },
        { opacity: 1, y: 0, scale: 1, duration: 1.0, delay,
          ease: 'expo.out',
          onComplete: () => {
            if (el.classList.contains('def-pillar-card')) {
              el.classList.add('revealed');
              attachCardHover(el);
              const icon = el.querySelector('[data-float]');
              if (icon) gsap.to(icon, { y: -5, duration: 1.4, ease: 'sine.inOut', yoyo: true, repeat: -1 });
            }
          }
        }
      );
    }
  }

  function advanceFlow() {
    const steps = flowSteps[activeFlowTab];
    if (!steps || flowIndex >= steps.length) return;
    const arrowIds = ['house-step-arrow1','house-step-arrow2','car-step-arrow1','car-step-arrow2'];
    steps[flowIndex].forEach((id, i) => {
      const el = document.getElementById(id);
      if (!el) return;
      const isArrow = arrowIds.includes(id);
      revealElement(el, i * 0.18, isArrow);
    });
    flowIndex++;
  }

  document.addEventListener('click', function(e) {
    if (e.target.closest('.ml-tab-btn')) return;
    const pane0 = document.getElementById('ml-pane-0');
    const pane1 = document.getElementById('ml-pane-1');
    const pane2 = document.getElementById('ml-pane-2');
    if (pane0 && pane0.classList.contains('active')) advanceFlow();
    else if (pane1 && pane1.classList.contains('active')) advanceFlow();
    else if (pane2 && pane2.classList.contains('active')) advanceFlow();
  });

  /* BP Neural Network Logic */
  let bpNNPos = [], bpNNEdges = [], bpPropLoop;
  function initBPNN() {
    const svg = document.getElementById('bp-nn-svg');
    if (!svg) return;
    svg.innerHTML = '';
    const layers = [3, 5, 4, 2];
    const xS = 20, xE = 180, yT = 15, yB = 85;
    
    bpNNPos = layers.map((count, li) => {
      const x = xS + (xE - xS) * (li / (layers.length - 1));
      const h = yB - yT;
      return Array.from({length: count}, (_, i) => ({
        x, y: count === 1 ? (yT + yB)/2 : yT + h * (i / (count - 1))
      }));
    });

    bpNNEdges = [];
    for (let li = 0; li < bpNNPos.length - 1; li++) {
      for (const a of bpNNPos[li]) {
        for (const b of bpNNPos[li + 1]) {
          const line = document.createElementNS(svgNS, 'line');
          line.setAttribute('class', 'nn-edge');
          line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
          line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
          svg.appendChild(line);
          bpNNEdges.push({ a, b });
        }
      }
    }
    bpNNPos.flat().forEach(p => {
      const c = document.createElementNS(svgNS, 'circle');
      c.setAttribute('class', 'nn-node');
      c.setAttribute('cx', p.x); c.setAttribute('cy', p.y); c.setAttribute('r', 3);
      svg.appendChild(c);
    });

    if (bpPropLoop) bpPropLoop.kill();
    bpPropLoop = gsap.timeline({ repeat: -1 });
    bpPropLoop.call(bpPropagate).to({}, { duration: 2.5 });
  }

  function bpPropagate() {
    const svg = document.getElementById('bp-nn-svg');
    if (!svg) return;
    const delayStep = 0.4;
    for (let li = 0; li < bpNNPos.length - 1; li++) {
      const layerDelay = li * delayStep;
      bpNNEdges.filter(e => e.a.x === bpNNPos[li][0].x).forEach(e => {
        const s = document.createElementNS(svgNS, 'circle');
        s.setAttribute('class', 'nn-signal');
        s.setAttribute('cx', e.a.x); s.setAttribute('cy', e.a.y); s.setAttribute('r', 1.5);
        svg.appendChild(s);
        gsap.to(s, {
          attr: { cx: e.b.x, cy: e.b.y }, opacity: 1, duration: 0.6, delay: layerDelay, ease: "power2.inOut",
          onComplete: () => s.remove()
        });
      });
    }
  }

  document.addEventListener('keydown', e => { 
    if (e.key === 'Escape') {
      closeBigPicture();
      closeDetailModal();
    }
  });


    // ── Listen for messages from parent ──
    window.addEventListener('message', (e) => {
      if (e.data.type === 'OPEN_GENAI_MODAL') {
        openDetailModal('gen');
      }
      if (e.data.type === 'RESTART_ANIMATION') {
        bt = 0;
      }
    });
  </script>
</body>

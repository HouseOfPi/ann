<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>What Are Parameters in AI Models?</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:     #0a1428;
    --fg:     #f1f5fb;
    --accent: #818cf8;
    --accent2:#34d399;
    --rule:   rgba(241,245,251,0.14);
    --muted:  rgba(241,245,251,0.55);
    --pulse:  rgba(129,140,248,0.55);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%; width: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    transition: background 0.5s, color 0.5s;
  }

  .stage {
    height: 100%; width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative; z-index: 1;
  }

  .title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: clamp(58px, 9.5vw, 148px);
    line-height: 0.95;
    letter-spacing: -0.02em;
    color: var(--fg);
    text-align: center;
    opacity: 0; transform: translateY(28px);
    animation: rise 1.2s cubic-bezier(.2,.7,.2,1) 0.3s forwards;
  }
  .title em {
    font-style: italic; font-weight: 400;
    color: var(--accent);
  }

  /* ── Floating weight values (decorative background) ── */
  .floats {
    position: fixed; inset: 0;
    pointer-events: none; overflow: hidden;
    z-index: 0;
  }
  .float-val {
    position: absolute;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px; font-weight: 600;
    opacity: 0;
    animation: floatUp var(--dur, 8s) ease-in-out var(--delay, 0s) infinite;
  }

  .stage { position: relative; z-index: 1; }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes floatUp {
    0%   { opacity: 0;    transform: translateY(0px); }
    15%  { opacity: 0.18; }
    80%  { opacity: 0.12; }
    100% { opacity: 0;    transform: translateY(-120px); }
  }
</style>
</head>
<body>

<!-- Floating decorative weight values in background -->
<div class="floats" id="floats"></div>

<div class="stage">
  <h1 class="title">What Are<br><em>Parameters</em><br>in AI Models?</h1>
</div>

<script>
// ── Theme sync ───────────────────────────────────────────────────
const PALETTES = {
  'Warm Linen':  { bg:'#f3f1e9', fg:'#1c1c1c', accent:'#e27b5e', accent2:'#4a8bdd' },
  'Green Linen': { bg:'#f3f1e9', fg:'#1c1c1c', accent:'#15803d', accent2:'#4a8bdd' },
  'Paper White': { bg:'#ffffff', fg:'#0a0a0a', accent:'#d0465a', accent2:'#2e5bff' },
  'Midnight':    { bg:'#000000', fg:'#f5f5f5', accent:'#f59e0b', accent2:'#22d3ee' },
  'Navy Lime':   { bg:'#0a1428', fg:'#f1f5fb', accent:'#a3e635', accent2:'#5fb8e6' },
  'Deep Navy':   { bg:'#07101f', fg:'#f0f6ff', accent:'#22d3ee', accent2:'#34d399' },
};

const floatsEl = document.getElementById('floats');
const vals = ['+0.82','-0.14','+0.67','-0.93','+0.31','+0.55','-0.72','+0.08','-0.49','+0.96','-0.21','+0.44','-0.88','+0.13','-0.37','+0.71'];

// Store random positions/sizes so they stay stable across palette changes
const floatData = Array.from({length:28}, () => ({
  val:   vals[Math.floor(Math.random()*vals.length)],
  left:  (Math.random()*96).toFixed(1)+'%',
  bottom:(Math.random()*60-10).toFixed(1)+'%',
  dur:   (7+Math.random()*8).toFixed(1)+'s',
  delay: (Math.random()*8).toFixed(1)+'s',
  size:  (11+Math.random()*10).toFixed(1)+'px',
  slot:  Math.floor(Math.random()*3), // 0=accent, 1=accent2, 2=mix
}));

function buildFloats(accent, accent2) {
  floatsEl.innerHTML = '';
  floatData.forEach(d => {
    const el = document.createElement('span');
    el.className = 'float-val';
    el.textContent = d.val;
    const hex = d.slot === 1 ? accent2 : accent;
    // convert hex to rgba with low opacity
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    const op = (Math.random()*0.15+0.06).toFixed(2);
    el.style.color = `rgba(${r},${g},${b},${op})`;
    el.style.left   = d.left;
    el.style.bottom = d.bottom;
    el.style.setProperty('--dur',   d.dur);
    el.style.setProperty('--delay', d.delay);
    el.style.fontSize = d.size;
    floatsEl.appendChild(el);
  });
}

function applyPalette(name) {
  const p = PALETTES[name] || PALETTES['Deep Navy'];
  const r = document.documentElement;
  r.style.setProperty('--bg',     p.bg);
  r.style.setProperty('--fg',     p.fg);
  r.style.setProperty('--accent', p.accent);
  document.body.style.background = p.bg;
  buildFloats(p.accent, p.accent2);
}

// Init with default (matches main presentation default)
applyPalette('Midnight');

window.addEventListener('message', e => {
  const d = e.data || {};
  if (d.type !== 'SET_THEME') return;
  applyPalette(d.palette || (d.mode === 'light' ? 'Paper White' : 'Deep Navy'));
});
try { window.parent.postMessage({ type: 'GET_THEME' }, '*'); } catch(e) {}
</script>
</body>
</html>
